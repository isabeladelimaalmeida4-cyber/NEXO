<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Meu Painel de Negócios</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
:root{
  --bg:#F5F0EB; --surface:#FFFFFF; --sunken:#FAF6F2;
  --ink:#1F090B; --ink-2:#655154; --ink-3:#8E7C7D;
  --line:#E8DFDA; --line-2:#D5C9C7;
  --brand:#4A1A22; --on-brand:#F4EEE8;
  --gold:#8A672B; --gold-soft:#F2E8D6;
  --head:#2B1014; --head-ink:#F4EEE8; --head-ink-2:#CBB9B6; --head-line:#4A262C; --head-accent:#C6A16A;
  --pos:#2B6A4C; --pos-soft:#E3EFE7;
  --neg:#A2342A; --neg-soft:#F6E2DE;
  --warn:#8F5F0C; --warn-soft:#F6EBD2;
  --font-display:"Playfair Display",Georgia,"Times New Roman",serif;
  --font-body:"Work Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --head-ok:#86C9A1; --head-warn:#E5BC6C; --head-err:#F09A88;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1F090B; --surface:#2B1014; --sunken:#230C0F;
    --ink:#F4EEE8; --ink-2:#CDBFBD; --ink-3:#A08D8C;
    --line:#44252B; --line-2:#5C383E;
    --brand:#C6A16A; --on-brand:#1F090B;
    --gold:#C6A16A; --gold-soft:#3B2A1D;
    --head:#150506; --head-ink:#F4EEE8; --head-ink-2:#B9A6A3; --head-line:#3A181D; --head-accent:#C6A16A;
    --pos:#86C9A1; --pos-soft:#1F3229;
    --neg:#F09A88; --neg-soft:#45201D;
    --warn:#E5BC6C; --warn-soft:#3D2E16;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1F090B; --surface:#2B1014; --sunken:#230C0F;
  --ink:#F4EEE8; --ink-2:#CDBFBD; --ink-3:#A08D8C;
  --line:#44252B; --line-2:#5C383E;
  --brand:#C6A16A; --on-brand:#1F090B;
  --gold:#C6A16A; --gold-soft:#3B2A1D;
  --head:#150506; --head-ink:#F4EEE8; --head-ink-2:#B9A6A3; --head-line:#3A181D; --head-accent:#C6A16A;
  --pos:#86C9A1; --pos-soft:#1F3229;
  --neg:#F09A88; --neg-soft:#45201D;
  --warn:#E5BC6C; --warn-soft:#3D2E16;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,p,ul,ol{margin:0}
ul{padding:0;list-style:none}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
svg.ic{width:16px;height:16px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.shell{max-width:1080px;margin-inline:auto;padding-inline:16px}
/* topo */
.top{background:var(--head);color:var(--head-ink)}
.top-in{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:6px 24px;padding-block:22px 14px}
.top h1{font-family:var(--font-display);font-weight:600;font-size:26px;line-height:1.15;text-wrap:balance}
.top-meta{display:flex;flex-direction:column;gap:2px;min-width:0}
.top .date{color:var(--head-ink-2);font-size:13px}
.save{display:flex;flex-wrap:wrap;align-items:center;gap:4px 7px;font-size:12.5px;color:var(--head-ink-2)}
.linkbtn{background:none;border:0;padding:0;color:var(--head-accent);font-size:12.5px;font-weight:600;cursor:pointer;text-decoration:underline}
.sdot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;background:var(--head-ink-2)}
.sdot.ok{background:var(--pos)} .sdot.dirty{background:var(--warn)} .sdot.err{background:var(--neg)}
.top .sdot.ok{background:var(--head-ok)} .top .sdot.dirty{background:var(--head-warn)} .top .sdot.err{background:var(--head-err)}
@media (min-width:720px){.top-meta{align-items:flex-end}}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--head);border-bottom:1px solid var(--head-line)}
.tabs-in{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs-in::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;background:none;border:0;border-bottom:2px solid transparent;cursor:pointer;color:var(--head-ink-2);font-size:14px;font-weight:500;padding:11px 14px 10px;margin-bottom:-1px}
.tab:first-child{margin-left:-14px}
.tab:hover{color:var(--head-ink)}
.tab[aria-selected="true"]{color:var(--head-ink);border-bottom-color:var(--head-accent)}
/* estrutura */
main{padding-block:20px 56px;display:flex;flex-direction:column;gap:16px}
.cols{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
@media (min-width:900px){.cols{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel:empty{display:none}
.ph{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;margin-bottom:12px}
.ph h2{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
.count{font-size:12px;font-weight:600;color:var(--ink-2);background:var(--sunken);border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-variant-numeric:tabular-nums}
.note{color:var(--ink-3);font-size:13px}
.empty{color:var(--ink-3);font-size:14px;padding:8px 0 2px}
.label{font-size:11.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase}
.dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;display:inline-block}
.pos{color:var(--pos)} .neg{color:var(--neg)}
.pill{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:2px 8px;background:var(--sunken);color:var(--ink-2);white-space:nowrap}
.pill.neg{background:var(--neg-soft);color:var(--neg)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.row.sb{justify-content:space-between}
/* resumo */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stat{padding:12px 16px;border-top:1px solid var(--line);border-left:1px solid var(--line);margin:-1px 0 0 -1px;min-width:0}
.stat .label{color:var(--ink-3)}
.stat .val{font-family:var(--font-display);font-weight:600;font-size:24px;line-height:1.25;font-variant-numeric:lining-nums tabular-nums;overflow-wrap:anywhere}
.stat .val.sm{font-size:20px;padding-top:3px}
@media (min-width:720px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
/* destaque */
.focus{background:var(--head);color:var(--head-ink);border:1px solid var(--head-line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:8px;min-width:0}
.focus .label{color:var(--head-accent)}
.focus h2{font-family:var(--font-display);font-weight:600;font-size:24px;line-height:1.2;text-wrap:balance;overflow-wrap:anywhere}
.focus p{color:var(--head-ink-2);font-size:14.5px;max-width:60ch;overflow-wrap:anywhere;white-space:pre-line}
.focus p b{color:var(--head-ink);font-weight:500}
/* campos */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field > span{font-size:12px;font-weight:500;color:var(--ink-2)}
.in,select.in,textarea.in{width:100%;min-width:0;padding:9px 11px;border:1px solid var(--line-2);border-radius:8px;background:var(--sunken);color:var(--ink);font-size:16px;line-height:1.35}
.in::placeholder{color:var(--ink-3)}
.in:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.in.invalid{border-color:var(--neg)}
textarea.in{resize:vertical;min-height:64px}
@media (min-width:720px){.in,select.in,textarea.in{font-size:14.5px}}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form .full{grid-column:1 / -1}
.form .actions{grid-column:1 / -1;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px}
.form .actions .left{margin-right:auto}
.hint{font-size:12.5px;color:var(--ink-3);grid-column:1 / -1}
.ferr{font-size:13.5px;color:var(--neg);grid-column:1 / -1}
.ext{font-size:13px;color:var(--gold);grid-column:1 / -1}
.check{display:flex;align-items:center;gap:8px;font-size:14px;grid-column:1 / -1;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--brand)}
.btn{background:var(--brand);color:var(--on-brand);border:1px solid var(--brand);border-radius:8px;padding:9px 16px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line-2)}
.btn.quiet{background:transparent;color:var(--neg);border-color:transparent;padding-inline:8px}
.btn.danger{background:var(--neg);border-color:var(--neg);color:var(--surface)}
.btn.sm{padding:5px 11px;font-size:12.5px}
.btn:disabled{background:transparent;border-color:var(--line);color:var(--ink-3);cursor:default;filter:none}
.icon-btn{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;background:none;border:0;border-radius:6px;color:var(--ink-3);cursor:pointer}
.icon-btn:hover{background:var(--sunken);color:var(--ink)}
.icon-btn.del:hover{color:var(--neg)}
.icon-btn svg{pointer-events:none}
.confirm{background:var(--neg-soft);border-radius:8px;padding:12px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;font-size:14px;grid-column:1 / -1}
.confirm span{flex:1 1 180px;min-width:0}
.confirm div{display:flex;gap:8px}
.monthnav{display:flex;align-items:center;gap:2px}
.monthnav strong{font-family:var(--font-display);font-weight:600;font-size:17px;min-width:9.2em;text-align:center}
/* agenda */
.dayg{border-top:1px solid var(--line);padding:12px 0 4px}
.dayg:first-child{border-top:0;padding-top:0}
.dayh{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:2px}
.dayg.now .dayh{color:var(--gold)}
.ev{display:flex;gap:12px;align-items:baseline;width:calc(100% + 16px);margin-inline:-8px;text-align:left;background:none;border:0;border-radius:8px;padding:8px;cursor:pointer}
.ev:hover{background:var(--sunken)}
.ev.on{background:var(--gold-soft)}
.ev .when{flex:0 0 96px;font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.ev .what{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ev .what b{font-weight:500;overflow-wrap:anywhere}
.ev .what small{font-size:12.5px;color:var(--ink-3);overflow-wrap:anywhere}
.agrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.agrid .wd{font-size:11px;font-weight:600;color:var(--ink-3);text-align:center;padding:2px 0 6px;text-transform:uppercase;letter-spacing:.06em}
.agrid button{min-height:40px;border:1px solid transparent;border-radius:8px;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13.5px;font-variant-numeric:tabular-nums;cursor:pointer;color:var(--ink);padding:0}
.agrid button:hover{background:var(--sunken)}
.agrid button::after{content:"";width:5px;height:5px;border-radius:50%;background:transparent}
.agrid .has::after{background:var(--gold)}
.agrid .past{color:var(--ink-3)}
.agrid .today{border-color:var(--line-2);font-weight:600}
.agrid .sel{background:var(--brand);color:var(--on-brand)}
.agrid .sel.has::after{background:var(--on-brand)}
.conn{display:flex;flex-direction:column;gap:10px;font-size:14px}
.conn .st{display:flex;align-items:center;gap:8px;font-weight:500}
.conn p{color:var(--ink-2)}
.steps{padding-left:20px;display:flex;flex-direction:column;gap:6px;color:var(--ink-2)}
.steps code{font-size:12.5px;background:var(--sunken);border:1px solid var(--line);border-radius:4px;padding:1px 5px;overflow-wrap:anywhere}
.conn a{color:var(--gold)}
/* financeiro */
.filters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:end}
.filters .wide{grid-column:1 / -1}
@media (min-width:900px){.filters{grid-template-columns:repeat(6,minmax(0,1fr))}.filters .wide{grid-column:span 2}}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
.kpis > div{min-width:0}
.kpis .label{color:var(--ink-3)}
.kpis .val{font-family:var(--font-display);font-weight:600;font-size:21px;line-height:1.3;font-variant-numeric:lining-nums tabular-nums;overflow-wrap:anywhere}
.kpis .sub .val{font-size:17px}
@media (min-width:560px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
.kpis hr{grid-column:1 / -1;border:0;border-top:1px solid var(--line);margin:0;width:100%}
.bars > li{padding:9px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.bars > li:first-child{border-top:0}
.bars .r{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:14.5px}
.bars .r b{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip{display:inline-flex;align-items:baseline;gap:7px;min-width:0;overflow-wrap:anywhere}
.bar{height:4px;border-radius:2px;background:var(--line)}
.bar i{display:block;height:100%;border-radius:2px;background:var(--pos)}
.bar i.n{background:var(--neg)}
.ledger > li{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line)}
.ledger > li:first-child{border-top:0}
.en{flex:1;min-width:0;display:flex;align-items:center;gap:10px;text-align:left;background:none;border:0;border-radius:8px;padding:9px 8px;margin-left:-8px;cursor:pointer}
.en:hover{background:var(--sunken)}
.en.on{background:var(--gold-soft)}
.en .desc{flex:1;min-width:0;display:flex;flex-direction:column}
.en .desc b{font-weight:500;overflow-wrap:anywhere}
.en .desc small{font-size:12.5px;color:var(--ink-3);overflow-wrap:anywhere}
.en .amt{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.bizlist > li{display:flex;align-items:center;gap:8px;padding:5px 0}
.bname{flex:1;min-width:0;border:0;border-bottom:1px solid transparent;background:transparent;padding:4px 0;font-size:15px}
.bname:focus{outline:none;border-bottom-color:var(--gold)}
.addrow{display:flex;gap:8px;margin-top:10px}
.addrow .in{flex:1}
@media (prefers-reduced-motion:no-preference){.btn,.tab,.icon-btn,.in,.ev,.en{transition:background-color .15s,border-color .15s,color .15s,box-shadow .15s}}
</style>
</head>
<body>
<header class="top">
  <div class="shell top-in">
    <h1>Meu Painel de Negócios</h1>
    <div class="top-meta">
      <p class="date" id="today"></p>
      <p class="save"><i class="sdot" id="sdot"></i><span id="status">Carregando…</span><button class="linkbtn" id="retry" hidden>Tentar de novo</button></p>
    </div>
  </div>
</header>
<nav class="tabs" aria-label="Seções do painel">
  <div class="shell tabs-in" role="tablist">
    <button class="tab" role="tab" data-tab="agenda" aria-selected="true">Agenda</button>
    <button class="tab" role="tab" data-tab="dinheiro" aria-selected="false">Financeiro</button>
  </div>
</nav>
<main class="shell" id="view"></main>

<script>
(function(){
"use strict";

function hasClaude(){return !!(window.claude&&typeof window.claude.use==="function");}
var FRAMED=(function(){try{return window.top!==window;}catch(e){return true;}})();
var SOLO=!hasClaude()&&!FRAMED;
function waitClaude(){
  return new Promise(function(res){
    var n=0;(function chk(){ if(hasClaude()) return res(true); if(++n>50) return res(false); setTimeout(chk,200); })();
  });
}
var USE_GCAL=false;
var GOOGLE_CLIENT_ID="";
var GCAL="Google Calendar";
var TZ=(function(){ try{ return Intl.DateTimeFormat().resolvedOptions().timeZone||"America/Cuiaba"; }catch(e){ return "America/Cuiaba"; } })();
var DAYS_SHORT=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
var MONTHS=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
var PALETTE=["#4a6fa5","#8a5a2b","#3f6d8c","#a8741a","#7a4a7a","#5a6b72","#2f7a6b","#b0513f","#5b5fa8","#7d8a2e","#b0457a","#3d8a9c"];
var CATS=["Serviço","Venda","Material","Transporte","Alimentação","Impostos","Salário","Assinaturas"];
var DEFAULT_BIZ=[
  {id:"prefeitura",  name:"Monitoramento Urbano (Prefeitura)", color:"#4a6fa5", day:1, next:""},
  {id:"consultoria", name:"Auxílio Empresarial",               color:"#8a5a2b", day:2, next:""},
  {id:"faculdade",   name:"Faculdade (EAD)",                   color:"#3f6d8c", day:3, next:""},
  {id:"joias",       name:"Joias (Leilão → Joalherias)",       color:"#a8741a", day:4, next:""},
  {id:"revendedora", name:"Revendedora (sociedade)",           color:"#7a4a7a", day:5, next:""},
  {id:"trabalho",    name:"Projeto interno (trabalho fixo)",   color:"#5a6b72", day:-1,next:""},
  {id:"nexo",        name:"NEXO",                              color:"#8c2f3f", day:-1,next:""}
];
var IC={
  x:'<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  left:'<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>',
  right:'<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>'
};

var state={businesses:clone(DEFAULT_BIZ),tasks:[],entries:[],appts:[],weekFocus:"",removed:{}};
var tab="agenda", db=null, rev=0, saving=false, saveTimer=null;
var agMonth=todayISO().slice(0,7), agSel=todayISO(), agPast=false, agForm=null;
var fin={mode:"mes",month:todayISO().slice(0,7),q:"",biz:"",type:"",st:""}, finForm=null, confirmBiz=null, lastBiz=null;
var cal={mode:"none",status:"idle",msg:"",events:[],now:[],at:0,live:false,loadedKey:null,winKey:agMonth,input:null,unsub:null,mcp:null,perms:null,tok:null,busy:false,pushing:false,manual:false};

/* utilidades */
function $(s){return document.querySelector(s);}
function clone(o){return JSON.parse(JSON.stringify(o));}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);}
function pad(n){return String(n).padStart(2,"0");}
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function todayISO(){return iso(new Date());}
function parseDay(s){var p=String(s).split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
function addDays(s,n){var d=parseDay(s);d.setDate(d.getDate()+n);return iso(d);}
function dayDiff(a,b){return Math.round((parseDay(b)-parseDay(a))/864e5);}
function mins(t){var p=String(t||"").split(":");return (+p[0])*60+(+p[1]||0);}
function hm(d){return pad(d.getHours())+":"+pad(d.getMinutes());}
function hhmm(t){return new Date(t||Date.now()).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});}
function shiftMonth(m,n){var p=m.split("-"),d=new Date(+p[0],+p[1]-1+n,1);return iso(d).slice(0,7);}
function monthLabel(m){var p=m.split("-");return MONTHS[+p[1]-1]+" de "+p[0];}
function dayLong(s){var d=parseDay(s);return DAYS_SHORT[d.getDay()]+", "+d.getDate()+" de "+MONTHS[d.getMonth()];}
function fmtDate(s){var p=String(s||"").split("-");return p.length===3?p[2]+"/"+p[1]+"/"+p[0].slice(2):String(s||"");}
function money(n){return "R$ "+(Number(n)||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});}
function signed(n){return (n<0?"−":"")+money(Math.abs(n));}
function parseMoney(s){
  s=String(s||"").trim().replace(/[^\d.,]/g,"");
  if(s.indexOf(",")>-1) s=s.replace(/\./g,"").replace(",",".");
  else if(/^\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,"");
  return parseFloat(s);
}
function color(c){return /^#[0-9a-f]{3,8}$/i.test(String(c||""))?c:"#888888";}
function dot(b){return '<i class="dot" style="background:'+color(b.color)+'"></i>';}
function bizKnown(id){return state.businesses.some(function(b){return b.id===id;});}
function bizById(id){
  for(var i=0;i<state.businesses.length;i++) if(state.businesses[i].id===id) return state.businesses[i];
  return {id:id,name:id?"Negócio removido":"Sem negócio",color:"#888888"};
}
function plain(s){return String(s||"").replace(/<br\s*\/?>/gi,"\n").replace(/<\/p>\s*<p[^>]*>/gi,"\n").replace(/<[^>]+>/g,"").replace(/&nbsp;/g," ").replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">").trim();}
function invalid(el){
  if(!el) return;
  el.classList.add("invalid"); el.focus();
  el.addEventListener("input",function(){el.classList.remove("invalid");},{once:true});
}
function inside(sel){var r=$(sel),a=document.activeElement;return !!(r&&a&&r.contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName));}
function showOnPhone(sel){var el=$(sel);if(el&&window.innerWidth<900&&el.scrollIntoView) el.scrollIntoView({block:"start"});}

var LS_KEY="painel_negocios_v1";
function setStatus(text,kind,retry){
  var el=$("#status"),d=$("#sdot"),r=$("#retry");
  if(el) el.textContent=text;
  if(d) d.className="sdot"+(kind?" "+kind:"");
  if(r) r.hidden=!retry;
}
function payload(){
  return clone({businesses:state.businesses,tasks:state.tasks,entries:state.entries,appts:state.appts,
    weekFocus:state.weekFocus,removed:state.removed,updatedAt:Date.now()});
}
function localSave(p){try{localStorage.setItem(LS_KEY,JSON.stringify(p));return true;}catch(e){return false;}}
function localLoad(){try{var raw=localStorage.getItem(LS_KEY);return raw?JSON.parse(raw):null;}catch(e){return null;}}
function applyData(src){
  var d; try{d=clone(src);}catch(e){return;}
  if(!d) return;
  if(Array.isArray(d.businesses)) state.businesses=d.businesses;
  if(Array.isArray(d.tasks)) state.tasks=d.tasks;
  if(Array.isArray(d.entries)) state.entries=d.entries;
  if(Array.isArray(d.appts)) state.appts=d.appts;
  if(typeof d.weekFocus==="string") state.weekFocus=d.weekFocus;
  if(d.removed&&typeof d.removed==="object") state.removed=d.removed;
}
function mergeDefaults(){
  DEFAULT_BIZ.forEach(function(d){
    if(!bizKnown(d.id)&&!state.removed[d.id]) state.businesses.push(clone(d));
  });
}
async function connectDb(){ if(!(await waitClaude())) return null; try{return await window.claude.use("db");}catch(e){return null;} }
function touch(){
  rev++;
  var ok=localSave(payload());
  if(SOLO){ setStatus(ok?"Salvo neste navegador às "+hhmm()+".":"Não deu para salvar neste navegador.",ok?"ok":"err"); return; }
  setStatus("Salvando…","dirty");
  clearTimeout(saveTimer); saveTimer=setTimeout(flush,900);
}
async function flush(){
  if(SOLO||saving) return;
  clearTimeout(saveTimer);
  saving=true;
  var my=rev,code="",ok=false;
  if(!db) db=await connectDb();
  if(db){
    try{await db.doc("state/main").set(payload());ok=true;}
    catch(e){code=(e&&e.code)?" ("+e.code+")":"";}
  }
  saving=false;
  if(rev!==my){ saveTimer=setTimeout(flush,900); return; }
  if(ok) setStatus("Salvo às "+hhmm()+".","ok");
  else setStatus("Salvo só neste aparelho. A sincronização falhou"+code+".","err",true);
}
async function load(){
  var local=localLoad();
  if(local) applyData(local);
  mergeDefaults();
  agReset(); finReset();
  render();
  initCal();
  if(SOLO){ setStatus("Os dados ficam salvos só neste navegador.","ok"); return; }
  db=await connectDb();
  if(!db){ setStatus(local?"Sem sincronizar. Mostrando o que está neste aparelho.":"Sem conexão com seus dados. Recarregue a página.",local?"dirty":"err",true); return; }
  try{
    var snap=await db.doc("state/main").get(),remote=null;
    if(snap&&snap.exists) remote=(typeof snap.data==="function")?snap.data():snap.data;
    var localNewer=!!(local&&remote&&(Number(local.updatedAt)||0)>(Number(remote.updatedAt)||0));
    if(remote&&!localNewer){ applyData(remote); mergeDefaults(); if(!finForm.id&&!finForm.desc&&!finForm.value) finReset(); refreshData(); }
    if(localNewer||(local&&!remote)||rev>0){ setStatus("Salvando…","dirty"); saveTimer=setTimeout(flush,300); }
    else setStatus("Tudo salvo.","ok");
  }catch(e){
    setStatus(local?"Não carregou da nuvem. Mostrando o que está neste aparelho.":"Não deu para carregar seus dados. Recarregue a página.",local?"dirty":"err",true);
  }
}

/* calendário: eventos */
function byTs(a,b){return a.ts-b.ts||(a.title<b.title?-1:1);}
function normG(e){
  if(!e||e.status==="cancelled"||!e.start||e.id==null) return null;
  var allDay=!!e.start.date&&!e.start.dateTime;
  var o={id:String(e.id),src:"g",title:e.summary||"(Sem título)",allDay:allDay,loc:e.location||"",
    note:plain(e.description),link:e.htmlLink||"",rec:!!e.recurringEventId};
  if(allDay){
    o.d1=e.start.date; o.d2=(e.end&&e.end.date)?addDays(e.end.date,-1):o.d1; if(o.d2<o.d1) o.d2=o.d1;
    o.t1=o.t2=""; o.ts=parseDay(o.d1).getTime(); o.te=parseDay(o.d2).getTime()+864e5;
  }else{
    var a=new Date(e.start.dateTime),b=new Date((e.end&&e.end.dateTime)||e.start.dateTime);
    if(isNaN(a.getTime())) return null;
    if(isNaN(b.getTime())) b=a;
    o.d1=iso(a); o.d2=iso(b); o.t1=hm(a); o.t2=hm(b); o.ts=a.getTime(); o.te=b.getTime();
  }
  return o;
}
function normL(a){
  var o={id:a.id,src:"local",title:a.title,allDay:!!a.allDay,loc:a.loc||"",note:a.note||"",link:"",rec:false,d1:a.date,d2:a.date};
  if(o.allDay){o.t1=o.t2="";o.ts=parseDay(a.date).getTime();o.te=o.ts+864e5;}
  else{o.t1=a.t1||"09:00";o.t2=a.t2||o.t1;o.ts=new Date(a.date+"T"+o.t1+":00").getTime();o.te=new Date(a.date+"T"+o.t2+":00").getTime();}
  return o;
}
function covers(e,day){return e.allDay?(e.d1<=day&&day<=e.d2):e.d1===day;}
function locals(){return state.appts.map(normL);}
function nowList(){return cal.now.concat(locals()).sort(byTs);}
function monthList(){
  var a=agMonth+"-01",b=addDays(shiftMonth(agMonth,1)+"-01",-1);
  return cal.events.concat(locals()).filter(function(e){return e.d1<=b&&(e.allDay?e.d2:e.d1)>=a;}).sort(byTs);
}
function findEv(id,src){
  var l=cal.events.concat(cal.now,locals());
  for(var i=0;i<l.length;i++) if(l[i].id===id&&l[i].src===src) return l[i];
  return null;
}

/* calendário: conexão */
var CACHE_KEY="painel_cal_cache", TOK_KEY="painel_gtok", CID_KEY="painel_gclient";
function clientId(){ if(GOOGLE_CLIENT_ID) return GOOGLE_CLIENT_ID; try{return localStorage.getItem(CID_KEY)||"";}catch(e){return "";} }
function calWin(m){
  var d=parseDay(shiftMonth(m,1)+"-01"); d.setDate(d.getDate()+7);
  return {start:m+"-01T00:00:00",end:iso(d)+"T00:00:00"};
}
function mkInput(){var w=calWin(cal.winKey);return {startTime:w.start,endTime:w.end,timeZone:TZ,orderBy:"startTime",pageSize:250};}
function cacheSave(){try{localStorage.setItem(CACHE_KEY,JSON.stringify({key:cal.loadedKey,events:cal.events,at:cal.at}));}catch(e){}}
function cacheLoad(){
  try{
    var c=JSON.parse(localStorage.getItem(CACHE_KEY)||"null");
    if(c&&c.key===agMonth&&Array.isArray(c.events)){ cal.events=c.events; cal.now=c.events; cal.at=c.at||0; cal.loadedKey=c.key; }
  }catch(e){}
}
function retract(){cal.events=[];cal.now=[];cal.loadedKey=null;cal.live=false;try{localStorage.removeItem(CACHE_KEY);}catch(e){}}
function setEvents(list,key,at){
  if(key!==cal.winKey) return;
  cal.events=list.map(normG).filter(Boolean).sort(byTs);
  cal.loadedKey=key; cal.at=at||Date.now(); cal.live=true; cal.status="ok"; cal.msg="";
  if(key===todayISO().slice(0,7)){ cal.now=cal.events; cacheSave(); }
  renderAgData();
}
function calData(result,key){
  var p=result?result.payload:null;
  if(typeof p==="string"){try{p=JSON.parse(p);}catch(e){p=null;}}
  if(!p&&result&&result.structuredContent) p=result.structuredContent;
  var list=p&&Array.isArray(p.events)?p.events:(Array.isArray(p)?p:null);
  if(!list){ cal.status="error"; cal.msg="O Google Agenda respondeu em um formato que o painel não entendeu."; renderAgData(); return; }
  setEvents(list,key,result.cache&&result.cache.storedAt);
}
function calError(e){
  var c=(e&&e.code)||"upstream_error";
  if(c==="needs_reauth"){ retract(); cal.status="error"; cal.msg="A conexão com o Google Agenda expirou. Reconecte em Configurações → Conectores, no Claude."; }
  else if(c==="server_not_connected"||c==="selection_required"||c==="server_not_found"){ retract(); cal.status="error"; cal.msg="O Google Agenda não está conectado nesta conta. Adicione em Configurações → Conectores, no Claude."; }
  else if(c==="blocked_by_policy"){ retract(); cal.status="error"; cal.msg="O acesso ao Google Agenda está bloqueado para esta conta."; }
  else if(c==="approval_required"||c==="not_in_manifest"||c==="consent_required"){ retract(); cal.status="needconnect"; cal.msg=""; }
  else if(c==="not_granted"||c==="capability_disabled"||c==="capability_removed"){ retract(); cal.status="off"; }
  else if(c==="auth"){ cal.live=false; cal.tok=null; try{sessionStorage.removeItem(TOK_KEY);}catch(x){} cal.status="needconnect"; cal.msg="Sua sessão do Google expirou."; }
  else if(c==="tool_error"||c==="http"){ cal.status="error"; cal.msg="O Google Agenda recusou o pedido"+(e.message?": "+String(e.message).slice(0,160):"."); }
  else{ cal.status=cal.live?"stale":"error"; cal.msg="Não consegui atualizar agora."+(cal.live?" Mostrando a última versão.":""); }
  renderAgData();
}
function calWatch(){
  if(cal.unsub){try{cal.unsub();}catch(e){} cal.unsub=null;}
  var input=cal.input=mkInput(), key=cal.winKey;
  if(typeof cal.mcp.watchTool!=="function"){ calRefresh(true); return; }
  cal.unsub=cal.mcp.watchTool(GCAL,"list_events",input,function(ev){
    if(cal.input!==input) return;
    if(ev.type==="data"){ cal.manual=false; return calData(ev.result,key); }
    var c=ev.error&&ev.error.code;
    if(c==="bad_request"||c==="capability_removed"){ cal.unsub=null; if(!cal.live) calRefresh(true); return; }
    if(c==="approval_required"&&cal.live){ cal.manual=true; renderAgConn(); return; }
    calError(ev.error);
  },{refetchInterval:60000});
}
async function calRefresh(quiet){
  var key=cal.winKey;
  if(!quiet){cal.busy=true;renderAgConn();}
  try{
    if(cal.mode==="mcp"){
      if(!cal.input) cal.input=mkInput();
      calData(await cal.mcp.callTool(GCAL,"list_events",cal.input,{cache:{refresh:true}}),key);
    }else if(cal.mode==="rest"){
      var w=calWin(key);
      var j=await gapi("GET","/events?singleEvents=true&orderBy=startTime&maxResults=250&timeMin="+encodeURIComponent(new Date(w.start).toISOString())+"&timeMax="+encodeURIComponent(new Date(w.end).toISOString()));
      setEvents((j&&j.items)||[],key);
    }
  }catch(e){ calError(e); }
  cal.busy=false; renderAgConn();
}
async function calConnect(){
  cal.status="loading"; cal.msg=""; renderAgConn();
  if(cal.mode==="rest"){
    try{ await gSignIn(); }catch(e){ cal.status="needconnect"; cal.msg="O login no Google não foi concluído."; renderAgConn(); return; }
    await calRefresh(true);
  }else{
    await calRefresh(true);
    if(cal.live) calWatch();
  }
  renderAgData();
}
function calSetMonth(){
  cal.winKey=agMonth; cal.input=null; cal.events=[]; cal.loadedKey=null;
  if(cal.live){ if(cal.mode==="mcp") calWatch(); else calRefresh(true); }
  renderAgData();
}
function mcpTimes(d){
  var sp=d.span||0;
  return d.allDay?{startTime:d.date+"T00:00:00",endTime:addDays(d.date,1+sp)+"T00:00:00",allDay:true,timeZone:TZ}
                 :{startTime:d.date+"T"+d.t1+":00",endTime:addDays(d.date,sp)+"T"+d.t2+":00",allDay:false,timeZone:TZ};
}
function restBody(d,isNew){
  var sp=d.span||0,b={summary:d.title};
  if(d.loc!==undefined) b.location=d.loc;
  if(d.note!==undefined) b.description=d.note;
  if(d.allDay){ b.start={date:d.date}; b.end={date:addDays(d.date,1+sp)}; if(!isNew){b.start.dateTime=null;b.start.timeZone=null;b.end.dateTime=null;b.end.timeZone=null;} }
  else{
    b.start={dateTime:new Date(d.date+"T"+d.t1+":00").toISOString(),timeZone:TZ};
    b.end={dateTime:new Date(addDays(d.date,sp)+"T"+d.t2+":00").toISOString(),timeZone:TZ};
    if(!isNew){b.start.date=null;b.end.date=null;}
  }
  return b;
}
async function calCreate(d){
  if(cal.mode==="rest") return gapi("POST","/events",restBody(d,true));
  var inp=mcpTimes(d); inp.summary=d.title;
  if(d.loc) inp.location=d.loc;
  if(d.note) inp.description=d.note;
  return calWrite("create_event",inp);
}
async function calUpdate(id,d){
  if(cal.mode==="rest") return gapi("PATCH","/events/"+encodeURIComponent(id),restBody(d,false));
  var inp=mcpTimes(d); inp.eventId=id; inp.summary=d.title;
  if(d.loc!==undefined) inp.location=d.loc;
  if(d.note!==undefined) inp.description=d.note;
  return calWrite("update_event",inp);
}
async function calDelete(id){
  if(cal.mode==="rest") return gapi("DELETE","/events/"+encodeURIComponent(id));
  return calWrite("delete_event",{eventId:id});
}
async function calWrite(tool,input){
  var r=await cal.mcp.callTool(GCAL,tool,input);
  try{ if(cal.mcp.invalidate) await cal.mcp.invalidate(GCAL,"list_events"); }catch(e){}
  return r;
}
function writeErr(e){
  var c=(e&&e.code)||"";
  if(c==="needs_reauth") return "A conexão com o Google Agenda expirou. Reconecte em Configurações → Conectores, no Claude.";
  if(c==="auth") return "Sua sessão do Google expirou. Entre de novo e repita.";
  if(c==="approval_required"||c==="not_in_manifest"||c==="consent_required"||c==="blocked_by_policy") return "O painel está sem permissão para alterar o Google Agenda.";
  if(c==="tool_error"||c==="http") return "O Google Agenda recusou"+(e.message?": "+String(e.message).slice(0,160):".");
  return "Não deu para confirmar se salvou. Confira a lista antes de tentar de novo.";
}
/* calendário: Google direto (fora do Claude) */
function gsiLoad(){
  return new Promise(function(res){
    if(window.google&&google.accounts&&google.accounts.oauth2) return res(true);
    var s=document.createElement("script"); s.src="https://accounts.google.com/gsi/client"; s.async=true;
    s.onload=function(){res(!!(window.google&&google.accounts&&google.accounts.oauth2));};
    s.onerror=function(){res(false);};
    document.head.appendChild(s);
  });
}
function gSignIn(){
  return new Promise(function(res,rej){
    gsiLoad().then(function(ok){
      if(!ok) return rej({code:"gsi"});
      var tc=google.accounts.oauth2.initTokenClient({client_id:clientId(),scope:"https://www.googleapis.com/auth/calendar.events",
        callback:function(r){
          if(r&&r.access_token){
            cal.tok={v:r.access_token,exp:Date.now()+((Number(r.expires_in)||3600)-90)*1000};
            try{sessionStorage.setItem(TOK_KEY,JSON.stringify(cal.tok));}catch(e){}
            res();
          }else rej(r||{});
        },
        error_callback:function(e){rej(e||{});}});
      tc.requestAccessToken({prompt:""});
    });
  });
}
async function gapi(method,path,body){
  if(!cal.tok||cal.tok.exp<Date.now()) throw {code:"auth"};
  var r;
  try{
    r=await fetch("https://www.googleapis.com/calendar/v3/calendars/primary"+path,{method:method,
      headers:{Authorization:"Bearer "+cal.tok.v,"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});
  }catch(e){ throw {code:"network"}; }
  if(r.status===401) throw {code:"auth"};
  if(r.status===204) return null;
  var j=null; try{j=await r.json();}catch(e){}
  if(!r.ok) throw {code:"http",message:(j&&j.error&&j.error.message)||("erro "+r.status)};
  return j;
}
async function initCal(){
  if(!USE_GCAL){ cal.status="none"; try{localStorage.removeItem(CACHE_KEY);}catch(e){} return; }
  cacheLoad();
  if(SOLO){
    cal.mode="rest";
    if(!clientId()){ cal.status="setup"; renderAgData(); return; }
    try{ var t=JSON.parse(sessionStorage.getItem(TOK_KEY)||"null"); if(t&&t.exp>Date.now()) cal.tok=t; }catch(e){}
    if(cal.tok){ cal.status="loading"; renderAgData(); await calRefresh(true); }
    else{ cal.status="needconnect"; gsiLoad(); }
    renderAgData(); return;
  }
  cal.mode="mcp"; cal.status="loading"; renderAgData();
  try{ cal.mcp=(await waitClaude())?await window.claude.use("mcp"):null; }catch(e){ cal.mcp=null; }
  if(!cal.mcp||typeof cal.mcp.callTool!=="function"){ cal.mcp=null; cal.status="off"; renderAgData(); return; }
  var st="prompt";
  try{ cal.perms=await window.claude.use("permissions"); if(cal.perms) st=await cal.perms.state("mcp:"+GCAL); }catch(e){ st="prompt"; }
  if(st==="granted"){ calWatch(); }
  else if(st==="denied"){ cal.status="denied"; }
  else cal.status="needconnect";
  renderAgData();
}
async function pushLocals(){
  cal.pushing=true; cal.msg=""; renderAgConn();
  var list=state.appts.slice();
  for(var i=0;i<list.length;i++){
    var a=list[i];
    try{
      await calCreate({title:a.title,date:a.date,allDay:!!a.allDay,t1:a.t1,t2:a.t2,loc:a.loc||"",note:a.note||"",span:0});
      state.appts=state.appts.filter(function(x){return x.id!==a.id;}); touch();
    }catch(e){ cal.msg=writeErr(e); break; }
  }
  cal.pushing=false;
  await calRefresh(true);
  renderAgData();
}

var AG_HTML='<section class="stats" id="ag-stats" aria-label="Resumo"></section>'+
  '<div class="cols"><div class="stack"><div id="ag-focus"></div><section class="panel" id="ag-list"></section></div>'+
  '<div class="stack"><section class="panel" id="ag-conn"></section><section class="panel" id="ag-grid"></section><section class="panel" id="ag-form"></section></div></div>';
function agReset(){
  agForm={id:null,src:null,title:"",date:agSel||todayISO(),allDay:false,t1:"09:00",t2:"10:00",loc:"",note:"",span:0,orig:null,busy:false,err:"",confirmDel:false};
}
function renderAg(){ renderAgData(); renderAgForm(); }
function renderAgData(){
  if(tab!=="agenda"||!$("#ag-stats")) return;
  renderAgStats(); renderAgFocus(); renderAgList(); renderAgGrid(); renderAgConn();
  if(!inside("#ag-form")&&!agForm.busy) renderAgForm();
}
function monthNet(m){
  var s=0; state.entries.forEach(function(e){ if((e.date||"").slice(0,7)===m&&e.status!=="pend") s+=(e.type==="in"?1:-1)*(Number(e.value)||0); });
  return s;
}
function renderAgStats(){
  var t=todayISO(),list=nowList(),n7=0;
  var nToday=list.filter(function(e){return covers(e,t);}).length;
  list.forEach(function(e){ for(var i=0;i<7;i++) if(covers(e,addDays(t,i))){ n7++; break; } });
  var net=monthNet(t.slice(0,7));
  $("#ag-stats").innerHTML=
    '<div class="stat"><p class="label">Hoje</p><p class="val">'+nToday+'</p></div>'+
    '<div class="stat"><p class="label">Próximos 7 dias</p><p class="val">'+n7+'</p></div>'+
    '<div class="stat"><p class="label">Em '+MONTHS[+agMonth.slice(5)-1]+'</p><p class="val">'+monthList().length+'</p></div>'+
    '<div class="stat"><p class="label">Saldo de '+MONTHS[new Date().getMonth()]+'</p><p class="val sm '+(net<0?"neg":(net>0?"pos":""))+'">'+signed(net)+'</p></div>';
}
function whenLabel(e){
  var t=todayISO(),now=Date.now(),day;
  if(e.ts<=now&&now<e.te) day=e.allDay?"Hoje":"Agora";
  else if(e.d1===t) day="Hoje"; else if(e.d1===addDays(t,1)) day="Amanhã"; else day=dayLong(e.d1);
  return day+(e.allDay?", dia inteiro":", das "+e.t1+" às "+e.t2);
}
function renderAgFocus(){
  var now=Date.now(),next=null,list=nowList();
  for(var i=0;i<list.length;i++) if(list[i].te>now){ next=list[i]; break; }
  var h='<section class="focus"><p class="label">Próximo compromisso</p>';
  if(next){
    h+='<h2>'+esc(next.title)+'</h2><p><b>'+esc(whenLabel(next))+'</b>'+(next.loc?"\n"+esc(next.loc):"")+'</p>'+

async function agSave(){
  var f=agForm; f.err="";
  var title=f.title.trim();
  if(!title) return invalid($("#af-title"));
  if(!f.date) return invalid($("#af-date"));
  if(!f.allDay){
    if(!f.t1) return invalid($("#af-t1"));
    if(!f.t2) return invalid($("#af-t2"));
    if(!f.span&&f.t2<=f.t1){ f.err="O horário de fim precisa ser depois do início."; return renderAgForm(); }
  }
  var d={title:title,date:f.date,allDay:f.allDay,t1:f.t1,t2:f.t2,loc:f.loc.trim(),note:f.note.trim(),span:f.span||0};
  var toG=f.id?f.src==="g":cal.live;
  if(!toG){
    var rec={id:f.id||("a"+uid()),title:d.title,date:d.date,allDay:d.allDay,t1:d.t1,t2:d.t2,loc:d.loc,note:d.note};
    if(f.id) state.appts=state.appts.map(function(a){return a.id===f.id?rec:a;}); else state.appts.push(rec);
    agSel=d.date; if(d.date.slice(0,7)!==agMonth){ agMonth=d.date.slice(0,7); calSetMonth(); }
    touch(); agReset(); renderAgData(); renderAgForm(); return;
  }
  if(f.id&&f.orig){
    if(d.loc===f.orig.loc) delete d.loc;
    if(d.note===f.orig.note) delete d.note;
  }
  f.busy=true; renderAgForm();
  try{
    if(f.id) await calUpdate(f.id,d); else await calCreate(d);
    agSel=d.date; agReset();
    if(d.date.slice(0,7)!==agMonth){ agMonth=d.date.slice(0,7); cal.winKey=agMonth; cal.input=null; cal.events=[]; cal.loadedKey=null; if(cal.mode==="mcp") calWatch(); }
    await calRefresh(true);
  }catch(e){
    f.busy=false; f.err=writeErr(e);
    if(e&&e.code==="auth") calError(e); else calRefresh(true);
  }
  renderAgData(); renderAgForm();
}
async function agDelete(){
  var f=agForm;
  if(f.src!=="g"){
    state.appts=state.appts.filter(function(a){return a.id!==f.id;});
    touch(); agReset(); renderAgData(); renderAgForm(); return;
  }
  f.busy=true; renderAgForm();
  try{ await calDelete(f.id); agReset(); await calRefresh(true); }
  catch(e){ f.busy=false; f.confirmDel=false; f.err=writeErr(e); if(e&&e.code==="auth") calError(e); else calRefresh(true); }
  renderAgData(); renderAgForm();
}

    '<label class="field full"><span>O que foi</span><input class="in" type="text" id="ff-desc" data-ff="desc" value="'+esc(f.desc)+'" placeholder="Ex.: sinal do site, lote 42"></label>'+
    '<label class="field"><span>Tipo</span><select class="in" id="ff-type" data-ff="type">'+opt("out","Saída",f.type)+opt("in","Entrada",f.type)+'</select></label>'+
    '<label class="field"><span>Valor (R$)</span><input class="in" type="text" inputmode="decimal" id="ff-value" data-ff="value" value="'+esc(f.value)+'" placeholder="0,00"></label>'+
    '<label class="field"><span>'+(f.status==="pend"?"Vencimento":"Data")+'</span><input class="in" type="date" id="ff-date" data-ff="date" value="'+esc(f.date)+'"></label>'+
    '<label class="field"><span>Situação</span><select class="in" id="ff-status" data-ff="status">'+opt("ok",f.type==="in"?"Recebido":"Pago",f.status)+opt("pend","Pendente",f.status)+'</select></label>'+
    '<label class="field full"><span>Negócio ou cliente</span><select class="in" id="ff-biz" data-ff="biz">'+
      state.businesses.map(function(b){return opt(b.id,b.name,f.biz);}).join("")+opt("","Sem negócio",f.biz)+
      (f.biz&&!bizKnown(f.biz)?opt(f.biz,"Negócio removido",f.biz):"")+'</select></label>'+
    '<label class="field full"><span>Categoria</span><input class="in" type="text" id="ff-cat" data-ff="cat" value="'+esc(f.cat)+'" list="ff-cats" placeholder="Ex.: Material, Serviço"></label>'+
    '<datalist id="ff-cats">'+Object.keys(cats).sort().map(function(c){return '<option value="'+esc(c)+'">';}).join("")+'</datalist>'+
    '<label class="field full"><span>Observação</span><textarea class="in" id="ff-note" data-ff="note" style="min-height:48px">'+esc(f.note)+'</textarea></label>'+
    (f.err?'<p class="ferr">'+esc(f.err)+'</p>':"");
  if(f.confirmDel){
    h+='<div class="confirm"><span>Excluir este lançamento?</span><div><button class="btn ghost" id="ff-delno">Não</button><button class="btn danger" id="ff-delyes">Excluir</button></div></div>';
  }else{
    h+='<div class="actions">'+(f.id?'<button class="btn quiet left" id="ff-del">Excluir</button><button class="btn ghost" id="ff-dup">Duplicar</button><button class="btn ghost" id="ff-cancel">Cancelar</button>':"")+
       '<button class="btn" id="ff-save">'+(f.id?"Salvar alterações":"Lançar")+'</button></div>';
  }
  el.innerHTML=h+'</div>';
}
function renderFiBiz(){
  var el=$("#fi-biz"); if(!el) return;
  var h='<header class="ph"><h2>Negócios e clientes</h2><span class="count">'+state.businesses.length+'</span></header>';
  h+=state.businesses.length?'<ul class="bizlist">'+state.businesses.map(function(b){
      var id=esc(b.id);
      if(confirmBiz===b.id) return '<li><div class="confirm" style="flex:1"><span>Tirar "'+esc(b.name)+'" da lista? Os lançamentos dele continuam.</span>'+
        '<div><button class="btn ghost sm" data-canceldel="1">Não</button><button class="btn danger sm" data-delbiz="'+id+'">Tirar</button></div></div></li>';
      return '<li>'+dot(b)+'<input class="bname" type="text" id="bn-'+id+'" data-bname="'+id+'" value="'+esc(b.name)+'" maxlength="80" aria-label="Nome">'+
        '<button class="icon-btn del" data-askdel="'+id+'" aria-label="Remover" title="Remover">'+IC.x+'</button></li>';
    }).join("")+'</ul>':'<p class="empty">Nenhum negócio cadastrado.</p>';
  h+='<div class="addrow"><input class="in" type="text" id="nb-name" maxlength="80" placeholder="Novo negócio ou cliente" aria-label="Novo negócio ou cliente"><button class="btn" id="nb-add">Adicionar</button></div>';
  el.innerHTML=h;
}
function finSave(){
  var f=finForm,v=parseMoney(f.value);
  if(isNaN(v)||v<=0) return invalid($("#ff-value"));
  if(!f.date) return invalid($("#ff-date"));
  var rec={id:f.id||uid(),desc:f.desc.trim(),biz:f.biz,type:f.type,value:Math.round(v*100)/100,date:f.date,
    status:f.status==="pend"?"pend":"ok",cat:f.cat.trim(),note:f.note.trim()};
  if(f.id) state.entries=state.entries.map(function(e){return e.id===f.id?rec:e;}); else state.entries.push(rec);
  if(fin.mode!=="tudo"&&rec.date.slice(0,fin.mode==="mes"?7:4)!==fin.month.slice(0,fin.mode==="mes"?7:4)){ fin.month=rec.date.slice(0,7); renderFiFilters(); }
  lastBiz=rec.biz;
  touch(); finReset(); renderFiOut(); renderFiForm();
}
function finEdit(id){
  var e=null; state.entries.forEach(function(x){ if(x.id===id) e=x; });
  if(!e) return;
  finForm={id:e.id,desc:e.desc||"",type:e.type==="in"?"in":"out",value:(Number(e.value)||0).toFixed(2).replace(".",","),date:e.date||todayISO(),
    status:e.status==="pend"?"pend":"ok",biz:e.biz||"",cat:e.cat||"",note:e.note||"",err:"",confirmDel:false};
  renderFiOut(); renderFiForm(); showOnPhone("#fi-form");
}
function refreshData(){
  if(tab==="agenda"){ renderAgData(); return; }
  renderFiOut();
  if(!inside("#fi-filters")) renderFiFilters();
  if(!inside("#fi-form")&&!finForm.id&&!finForm.desc&&!finForm.value){ finReset(); renderFiForm(); }
  if(!inside("#fi-biz")) renderFiBiz();
}

/* render e eventos */
function render(){
  var s=new Date().toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  $("#today").textContent=s.charAt(0).toUpperCase()+s.slice(1);
  var v=$("#view");
  if(tab==="dinheiro"){ v.innerHTML=FI_HTML; renderFi(); }
  else{ v.innerHTML=AG_HTML; renderAg(); }
}
function setTab(t){
  tab=t;
  document.querySelectorAll(".tab").forEach(function(x){x.setAttribute("aria-selected",x.getAttribute("data-tab")===t?"true":"false");});
  try{localStorage.setItem("painel_tab",t);}catch(e){}
}
document.addEventListener("click",function(e){
  var el=e.target,hit; if(!el.closest) return;
  if((hit=el.closest("[data-tab]"))){ confirmBiz=null; setTab(hit.getAttribute("data-tab")); render(); window.scrollTo(0,0); return; }
  if(el.closest("#retry")){ setStatus("Salvando…","dirty"); flush(); return; }

  if((hit=el.closest("[data-agmonth]"))){ agMonth=shiftMonth(agMonth,+hit.getAttribute("data-agmonth")); agPast=false; calSetMonth(); return; }
  if((hit=el.closest("[data-day]"))){
    agSel=hit.getAttribute("data-day");
    if(!agForm.id){ agForm.date=agSel; var di=$("#af-date"); if(di) di.value=agSel; }
    if(agSel<todayISO()&&!agPast){ agPast=true; renderAgList(); }
    renderAgGrid();
    var g=document.getElementById("dg-"+agSel); if(g&&g.scrollIntoView) g.scrollIntoView({block:"center"});
    return;
  }
  if((hit=el.closest("[data-ev]"))){ agEdit(hit.getAttribute("data-ev"),hit.getAttribute("data-src")); return; }
  if(el.closest("#ag-past")){ agPast=!agPast; renderAgList(); return; }
  if(el.closest("#ag-new")){ agReset(); renderAgList(); renderAgForm(); showOnPhone("#ag-form"); var ti=$("#af-title"); if(ti) ti.focus(); return; }
  if(el.closest("#af-save")){ agSave(); return; }
  if(el.closest("#af-cancel")){ agReset(); renderAgList(); renderAgForm(); return; }
  if(el.closest("#af-del")){ agForm.confirmDel=true; renderAgForm(); return; }
  if(el.closest("#af-delno")){ agForm.confirmDel=false; renderAgForm(); return; }
  if(el.closest("#af-delyes")){ agDelete(); return; }
  if(el.closest("#cal-connect")){ calConnect(); return; }
  if(el.closest("#cal-refresh")){ calRefresh(); return; }
  if(el.closest("#cal-push")){ pushLocals(); return; }
  if(el.closest("#cal-perms")){
    if(cal.perms&&cal.perms.manage) cal.perms.manage().then(function(){return cal.perms.state("mcp:"+GCAL);}).then(function(st){ if(st!=="denied"){ cal.status="needconnect"; renderAgConn(); } }).catch(function(){});
    return;
  }
  if(el.closest("#cal-signout")){
    try{ if(cal.tok&&window.google) google.accounts.oauth2.revoke(cal.tok.v,function(){}); }catch(x){}
    cal.tok=null; try{sessionStorage.removeItem(TOK_KEY);}catch(x){}
    retract(); cal.status="needconnect"; cal.msg=""; renderAgData(); return;
  }
  if(el.closest("#cal-resetid")){ try{localStorage.removeItem(CID_KEY);}catch(x){} cal.status="setup"; cal.msg=""; renderAgConn(); return; }
  if(el.closest("#cal-saveid")){
    var ci=$("#cal-cid"),cv=ci.value.trim();
    if(!/\.apps\.googleusercontent\.com$/.test(cv)){ cal.msg="O ID do cliente termina com .apps.googleusercontent.com. Confira se copiou inteiro."; renderAgConn(); return; }
    try{localStorage.setItem(CID_KEY,cv);}catch(x){}
    cal.msg=""; calConnect(); return;
  }

  if((hit=el.closest("[data-fimonth]"))){ fin.month=shiftMonth(fin.month,(+hit.getAttribute("data-fimonth"))*(fin.mode==="ano"?12:1)); renderFiFilters(); renderFiOut(); return; }
  if((hit=el.closest("[data-baixa]"))){
    var bid=hit.getAttribute("data-baixa");
    state.entries.forEach(function(x){ if(x.id===bid) x.status="ok"; });
    touch(); renderFiOut(); return;
  }
  if((hit=el.closest("[data-en]"))){ finEdit(hit.getAttribute("data-en")); return; }
  if(el.closest("#fi-new")){ finReset(); renderFiOut(); renderFiForm(); showOnPhone("#fi-form"); var de=$("#ff-desc"); if(de) de.focus(); return; }
  if(el.closest("#ff-save")){ finSave(); return; }
  if(el.closest("#ff-cancel")){ finReset(); renderFiOut(); renderFiForm(); return; }
  if(el.closest("#ff-dup")){ finForm.id=null; finForm.date=todayISO(); finForm.confirmDel=false; renderFiOut(); renderFiForm(); return; }
  if(el.closest("#ff-del")){ finForm.confirmDel=true; renderFiForm(); return; }
  if(el.closest("#ff-delno")){ finForm.confirmDel=false; renderFiForm(); return; }
  if(el.closest("#ff-delyes")){
    var did=finForm.id; state.entries=state.entries.filter(function(x){return x.id!==did;});
    touch(); finReset(); renderFiOut(); renderFiForm(); return;
  }
  if(el.closest("#nb-add")){
    var ni=$("#nb-name"),nm=ni.value.trim();
    if(!nm) return invalid(ni);
    var used=state.businesses.map(function(b){return String(b.color||"").toLowerCase();});
    var free=PALETTE.filter(function(c){return used.indexOf(c)<0;});
    state.businesses.push({id:"n"+uid(),name:nm,color:free.length?free[0]:PALETTE[state.businesses.length%PALETTE.length],day:-1,next:""});
    touch(); renderFiBiz(); renderFiFilters(); if(!finForm.id&&!finForm.desc&&!finForm.value){ var keep=finForm.biz; finReset(); if(keep) finForm.biz=keep; } renderFiForm(); return;
  }
  if((hit=el.closest("[data-askdel]"))){ confirmBiz=hit.getAttribute("data-askdel"); renderFiBiz(); return; }
  if(el.closest("[data-canceldel]")){ confirmBiz=null; renderFiBiz(); return; }
  if((hit=el.closest("[data-delbiz]"))){
    var rid=hit.getAttribute("data-delbiz");
    state.businesses=state.businesses.filter(function(b){return b.id!==rid;});
    state.removed[rid]=true; confirmBiz=null;
    if(fin.biz===rid) fin.biz="";
    touch(); renderFi(); return;
  }
});
function onField(e){
  var el=e.target,k; if(!el.getAttribute) return;
  if((k=el.getAttribute("data-af"))){
    if(k==="allDay"){ agForm.allDay=el.checked; if(e.type==="change") renderAgForm(); return; }
    var was=agForm[k]; agForm[k]=el.value;
    if(k==="t1"&&agForm.t1&&!agForm.span){
      var dur=mins(agForm.t2)-mins(was); if(!(dur>0)) dur=60;
      var end=Math.min(23*60+59,mins(agForm.t1)+dur);
      agForm.t2=pad(Math.floor(end/60))+":"+pad(end%60); var t2=$("#af-t2"); if(t2) t2.value=agForm.t2;
    }
    return;
  }
  if((k=el.getAttribute("data-ff"))){
    finForm[k]=el.value;
    if((k==="type"||k==="status")&&e.type==="change") renderFiForm();
    return;
  }
  if((k=el.getAttribute("data-flt"))){
    fin[k]=el.value;
    if(k==="mode"&&e.type==="change") renderFiFilters();
    renderFiOut(); return;
  }
  if((k=el.getAttribute("data-bname"))){
    if(e.type==="input"){ state.businesses.forEach(function(b){ if(b.id===k) b.name=el.value; }); return; }
    state.businesses.forEach(function(b){ if(b.id===k&&!b.name.trim()) b.name="Sem nome"; });
    touch(); renderFiBiz(); renderFiFilters(); renderFiOut(); if(!inside("#fi-form")) renderFiForm();
  }
}
document.addEventListener("input",onField);
document.addEventListener("change",onField);
document.addEventListener("keydown",function(e){
  if(e.key!=="Enter"||!e.target||e.target.tagName==="TEXTAREA") return;
  var id=e.target.id,b=null;
  if(id==="af-title"||id==="af-loc") b=$("#af-save");
  else if(id==="ff-desc"||id==="ff-value"||id==="ff-cat") b=$("#ff-save");
  else if(id==="nb-name") b=$("#nb-add");
  else if(id==="cal-cid") b=$("#cal-saveid");
  else if(e.target.classList&&e.target.classList.contains("bname")){ e.target.blur(); return; }
  if(b){ e.preventDefault(); b.click(); }
});
setInterval(function(){
  if(document.hidden||!cal.live||cal.busy) return;
  if(cal.mode==="rest"||(cal.mode==="mcp"&&!cal.unsub)) calRefresh(true);
},60000);
document.addEventListener("visibilitychange",function(){
  if(!document.hidden&&cal.live&&cal.mode==="rest"&&Date.now()-cal.at>20000) calRefresh(true);
});

try{ var saved=localStorage.getItem("painel_tab"); if(saved==="dinheiro") setTab("dinheiro"); }catch(e){}
load();
})();
</script>
</body>
</html>
