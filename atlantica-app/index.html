<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b4f54">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Atlântica">
<meta name="robots" content="noindex, nofollow">
<title>Atlantica Natural · Vendas & Prospecção</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#10282b;--ink-2:#34494b;--muted:#6b7774;--faint:#97a19d;
  --deep:#0b4f54;--sea:#11706f;--sea-2:#1d8a83;--sea-bg:#e2efec;
  --leaf:#4c8b5d;--paper:#f7f3ea;--card:#fffdf8;--sand:#efe6d4;--line:#e3dac8;
  --coral:#bf5530;--coral-bg:#fbe8df;--gold:#9a7412;--gold-bg:#f6edd2;--ok:#2c7a4b;--ok-bg:#e2f0e6;
  --r:18px;--shadow:0 1px 2px rgba(16,40,43,.05),0 8px 24px rgba(16,40,43,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font:15px/1.45 Manrope,system-ui,-apple-system,Segoe UI,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--sea)}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:650;letter-spacing:-.01em;margin:0}
.wrap{max-width:680px;margin:0 auto;padding:12px 16px calc(100px + env(safe-area-inset-bottom))}
/* header */
.top{position:sticky;top:0;z-index:30;background:rgba(247,243,234,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top)) 0 8px}
.top-in{max-width:680px;margin:0 auto;padding:0 12px 0 16px;display:flex;align-items:center;gap:10px;min-height:44px}
.brand{display:flex;flex-direction:column;line-height:1.05}
.brand b{font-family:Fraunces,serif;font-size:19px;font-weight:650;color:var(--deep)}
.brand small{font-size:9.5px;letter-spacing:.18em;font-weight:700;color:var(--muted);margin-top:3px}
.top h2{font-size:20px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp{flex:1}
.icon-btn{position:relative;width:42px;height:42px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.icon-btn:active{background:var(--sand)}
.badge{position:absolute;top:5px;right:4px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--coral);color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center}
.sync{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--leaf);display:inline-block}
.sync.local i{background:var(--gold)}
/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.nav-in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;font-weight:700;color:var(--faint);cursor:pointer}
.nav button.on{color:var(--deep)}
.nav button.mid span.ic{background:var(--deep);color:#fff;border-radius:14px;width:46px;height:34px;display:grid;place-items:center;margin-top:-2px}
.nav button.mid.on span.ic{background:var(--sea)}
/* blocks */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin:12px 0}
.card.flat{box-shadow:none}
.card h3{font-size:17px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card h3 .sp{flex:1}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:22px 2px 6px}
.sec h3{font-size:18px}
.sec a,.link{font-size:13px;font-weight:700;color:var(--sea);cursor:pointer;text-decoration:none;background:none;border:0;padding:0}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--muted)}
.muted{color:var(--muted)}.small{font-size:12.5px}.tiny{font-size:11.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
@media(min-width:560px){.grid4{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.stat .v{font-size:21px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:2px}
.stat .l{font-size:12px;color:var(--muted);font-weight:600}
.stat.warn .v{color:var(--coral)}
.stat.good .v{color:var(--ok)}
.hero{background:linear-gradient(150deg,var(--deep),#0e6564 60%,#1b7d6f);color:#eaf3ef;border-radius:22px;padding:18px;margin-top:6px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.12),transparent 70%)}
.hero .eyebrow{color:#a9d2c8}
.hero h1{font-size:25px;margin:4px 0 14px;color:#fff}
.goal{display:flex;gap:16px;align-items:center}
.goal .num{font-size:26px;font-weight:800;color:#fff;font-variant-numeric:tabular-nums}
.goal .meta{font-size:12.5px;color:#bfe0d7}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.quick button{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;font-weight:700;cursor:pointer;color:var(--ink-2)}
.quick button span.ic{width:38px;height:38px;border-radius:12px;background:var(--sea-bg);color:var(--deep);display:grid;place-items:center}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 14px;font-weight:700;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--deep);border-color:var(--deep);color:#fff}
.btn.sea{background:var(--sea);border-color:var(--sea);color:#fff}
.btn.wa{background:#1f9d55;border-color:#1f9d55;color:#fff}
.btn.ghost{background:transparent}
.btn.danger{color:var(--coral);border-color:#efc9b9;background:var(--card)}
.btn.sm{padding:7px 10px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.nowrap{flex-wrap:nowrap}
.scrollx{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.scrollx::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700;white-space:nowrap;cursor:pointer;color:var(--ink-2)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip .n{opacity:.6;font-weight:600;margin-left:3px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:800;border-radius:999px;padding:3px 9px;background:var(--sand);color:var(--ink-2);white-space:nowrap}
.pill.sea{background:var(--sea-bg);color:var(--deep)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--coral-bg);color:var(--coral)}
.pill.gold{background:var(--gold-bg);color:var(--gold)}
/* inputs */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label,.lbl{font-size:12.5px;font-weight:700;color:var(--ink-2)}
.inp,select.inp,textarea.inp{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 12px;font-size:15px;outline:none;min-height:44px}
textarea.inp{min-height:84px;resize:vertical;line-height:1.4}
.inp:focus{border-color:var(--sea);box-shadow:0 0 0 3px rgba(17,112,111,.14)}
.search{position:relative}
.search .inp{padding-left:38px}
.search svg{position:absolute;left:12px;top:12px;color:var(--faint)}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.filters select{font-size:13.5px;padding:9px 10px;min-height:40px}
.check{display:flex;gap:10px;align-items:center;font-weight:600;font-size:14px;padding:6px 0;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--deep)}
.hint{font-size:12px;color:var(--muted);margin-top:-6px;margin-bottom:12px}
/* lists */
.list{display:flex;flex-direction:column;gap:10px;margin:10px 0}
.item{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 14px;cursor:pointer;display:block}
.item:active{background:#fbf8f1}
.item .t{font-weight:800;font-size:15px;line-height:1.25}
.item .s{font-size:12.5px;color:var(--muted);margin-top:3px}
.item .hd{display:flex;gap:10px;align-items:flex-start}
.item .hd .grow{flex:1;min-width:0}
.item .amt{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.item .acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.av{width:40px;height:40px;border-radius:12px;background:var(--sea-bg);color:var(--deep);display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.thumb{width:52px;height:52px;border-radius:12px;background:var(--sand) center/cover;flex:none;display:grid;place-items:center;color:var(--faint)}
.empty{text-align:center;padding:34px 18px;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:18px;margin:12px 0}
.empty h3{color:var(--ink);font-size:18px;margin-bottom:6px}
.empty .btn{margin-top:12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:14px}
.kv dt{color:var(--muted);font-weight:600}
.kv dd{margin:0;font-weight:600;word-break:break-word}
.divider{height:1px;background:var(--line);margin:12px 0}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl td{padding:8px 0;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td.r{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.tot{display:flex;justify-content:space-between;font-weight:800;font-size:17px;padding-top:10px}
.bar{height:8px;background:var(--sand);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--sea);border-radius:6px}
.bar.ok i{background:var(--leaf)}
.hbar{display:grid;grid-template-columns:34px 1fr 40px;gap:8px;align-items:center;font-size:13px;margin:6px 0}
.hbar b{font-weight:800}
.hbar span.n{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.note{background:var(--gold-bg);color:#5e4a10;border-radius:14px;padding:11px 13px;font-size:13px;margin:10px 0;display:flex;gap:9px}
.note.sea{background:var(--sea-bg);color:var(--deep)}
.note.warn{background:var(--coral-bg);color:#7a3218}
.note svg{flex:none;margin-top:1px}
.notif{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.notif:last-child{border-bottom:0}
.notif .ico{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none;background:var(--sea-bg);color:var(--deep)}
.notif .ico.warn{background:var(--coral-bg);color:var(--coral)}
.notif .ico.gold{background:var(--gold-bg);color:var(--gold)}
.notif .ico.ok{background:var(--ok-bg);color:var(--ok)}
.notif .tx{flex:1;min-width:0}
.notif .tx b{display:block;font-size:14px}
.notif .tx span{font-size:12.5px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:10px;text-align:left}
.tile .ic{width:40px;height:40px;border-radius:12px;background:var(--sea-bg);color:var(--deep);display:grid;place-items:center}
.tile b{font-size:15px}
.tile span.s{font-size:12px;color:var(--muted);margin-top:-6px}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bdg{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center;font-size:12px;font-weight:700}
.bdg .ic{width:42px;height:42px;margin:0 auto 6px;border-radius:50%;display:grid;place-items:center;background:var(--gold-bg);color:var(--gold)}
.bdg.off{opacity:.42;filter:grayscale(1)}
.bdg small{display:block;font-weight:500;color:var(--muted);font-size:10.5px;margin-top:2px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.stepper button{border:0;background:none;width:34px;height:34px;font-size:18px;font-weight:700;cursor:pointer;color:var(--deep)}
.stepper input{width:42px;border:0;text-align:center;font-weight:800;outline:none;height:34px;background:transparent}
.line-item{border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin-bottom:8px;background:#fff}
.line-item .top-l{display:flex;justify-content:space-between;gap:8px;font-weight:800}
.line-item .ctl{display:flex;gap:8px;align-items:center;margin-top:8px}
.line-item .ctl .inp{min-height:36px;padding:7px 10px;width:110px}
.prod-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(min-width:560px){.prod-grid{grid-template-columns:repeat(3,1fr)}}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.pcard .ph{aspect-ratio:1/1;background:var(--sand) center/cover;display:grid;place-items:center;color:var(--faint)}
.pcard .bd{padding:10px 11px;display:flex;flex-direction:column;gap:4px;flex:1}
.pcard .bd b{font-size:13.5px;line-height:1.25}
.pcard .pr{font-weight:800;color:var(--deep)}
.cartbar{position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:25;max-width:656px;margin:0 auto;background:var(--ink);color:#fff;border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.stickybar{position:sticky;bottom:calc(72px + env(safe-area-inset-bottom));background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;box-shadow:0 -4px 24px rgba(16,40,43,.08);display:flex;align-items:center;gap:12px;margin-top:14px;z-index:5}
.stickybar .big{font-size:21px;font-weight:800;font-variant-numeric:tabular-nums}
/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(10,30,32,.42);z-index:60;animation:fade .18s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--paper);border-radius:22px 22px 0 0;max-height:92vh;display:flex;flex-direction:column;max-width:680px;margin:0 auto;animation:up .22s cubic-bezier(.2,.8,.2,1)}
.sheet-h{display:flex;align-items:center;gap:8px;padding:14px 12px 10px 18px;border-bottom:1px solid var(--line)}
.sheet-h h3{flex:1;font-size:19px}
.sheet-b{padding:16px 18px;overflow:auto;flex:1}
.sheet-f{padding:12px 18px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:8px;background:var(--card)}
.sheet-f .btn{flex:1}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.22s;z-index:80;max-width:92vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
/* lock */
.lock{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(160deg,var(--deep),#11706f)}
.lock .box{background:var(--card);border-radius:24px;padding:26px 22px;width:100%;max-width:380px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.lock h1{font-size:28px;margin:14px 0 4px}
.splash{min-height:100vh;display:grid;place-items:center;color:var(--muted);text-align:center}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--sea);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.vars{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 12px}
.vars code{background:var(--sand);border-radius:7px;padding:3px 7px;font-size:12px;cursor:pointer}
.preview{background:#e6f4ea;border-radius:12px 12px 12px 3px;padding:10px 12px;font-size:13.5px;white-space:pre-wrap;color:#173a26}
.chart text{font:600 10.5px Manrope,sans-serif;fill:var(--muted)}
.mono{font-variant-numeric:tabular-nums}
.right{text-align:right}
.mt0{margin-top:0}.mb0{margin-bottom:0}
.rtree{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 12px;margin:8px 0}
.rroot{display:flex;align-items:center;gap:8px;font-size:14px}
.rkids{margin-left:16px;padding-left:12px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:10px;margin-top:10px}
.rnode{position:relative}
.rnode:before{content:"";position:absolute;left:-14px;top:26px;width:12px;border-top:2px solid var(--line)}
.rcard{margin:0}
.rtoggle{display:block;margin:6px 0 0 4px;font-size:12.5px}
.hide{display:none!important}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet"></div>
<div id="toast"></div>
<input type="file" id="fileImport" accept=".csv,.xlsx,.xls,.json,text/csv,application/json" class="hide">
<input type="file" id="fileBackup" accept=".json,application/json" class="hide">
<script src="vendor/supabase.js"></script>
<script>
'use strict';
/* ============ ícones ============ */
const P={
home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',
target:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>',
bag:'<path d="M5 8h14l-1 12.5H6z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/>',
users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c1.9.8 3.1 2.6 3.5 5.2"/>',
grid:'<rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/>',
bell:'<path d="M6 16v-5a6 6 0 1 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/>',
back:'<path d="M15 5l-7 7 7 7"/>',plus:'<path d="M12 5v14M5 12h14"/>',x:'<path d="M6 6l12 12M18 6 6 18"/>',
check:'<path d="M5 12.5l4.5 4.5L19 7"/>',
wa:'<path d="M4 20l1.3-3.9A8 8 0 1 1 8 19.1z"/><path d="M9.2 8.6c-.4 2.9 2.6 6.3 6 6.2l.7-1.6-1.9-1-1 .8a4 4 0 0 1-2-2l.8-1-1-1.9z"/>',
phone:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a1 1 0 0 1-1 1A16 16 0 0 1 4 5a1 1 0 0 1 1-1z"/>',

function parseDate(v){
  if(v==null||v==='')return '';
  if(typeof v==='number'&&v>20000&&v<80000){const d=new Date(Math.round((v-25569)*864e5));return iso(new Date(d.getTime()+d.getTimezoneOffset()*6e4))}
  const s=String(v).trim();let m;
  if((m=s.match(/^(\d{4})-(\d{2})-(\d{2})/)))return`${m[1]}-${m[2]}-${m[3]}`;

  return '';
}

    vendasCliente(c.id).forEach(v=>(v.itens||[]).forEach(i=>{if(i.produtoId&&!last[i.produtoId])last[i.produtoId]=v.data}));
    Object.entries(last).forEach(([pid,d])=>{const p=get('produtos',pid);const ciclo=num(p&&p.ciclo);if(!ciclo)return;const due=addDays(d,ciclo);const dd=diffDays(t,due);if(dd<=3&&dd>=-30)out.push({c,p,data:d,due,dias:diffDays(d,t)})});
  });
  return out.sort((a,b)=>a.due.localeCompare(b.due));
}

    return this.enqueue('config/config',()=>this.run(sbc.from('app_registros').upsert(this.row('config',{...c,id:'config'}),{onConflict:'user_id,tipo,id'})));
  },
  err(e){
    console.warn(e);const m=String((e&&e.message)||e||'');
    if(/JWT|token|auth/i.test(m)){toast('Sua sessão expirou. Entre de novo.');this.sair();return}

async function chamarBusca(body){
  const{data,error}=await sbc.functions.invoke('app-busca',{body});
  if(error){let msg='Não foi possível buscar agora.';try{const j=await error.context.json();if(j&&j.error)msg=j.error}catch(e){if(/fetch|network/i.test(String(error.message)))msg='Sem conexão com a internet.'}throw new Error(msg)}
  return data;

/* ============ cálculos ============ */
function vendaStatus(v){const ps=v.parcelas||[];if(!ps.length||ps.every(p=>p.pagoEm))return'paga';const t=today();return ps.some(p=>!p.pagoEm&&p.venc<t)?'vencida':'aberta'}
const emAberto=v=>sum((v.parcelas||[]).filter(p=>!p.pagoEm),p=>p.valor);
const recebidoV=v=>sum((v.parcelas||[]).filter(p=>p.pagoEm),p=>p.valor);
const vendasCliente=id=>arr('vendas').filter(v=>v.clienteId===id).sort((a,b)=>b.data.localeCompare(a.data)||b.numero-a.numero);
const empWhats=e=>[e.celular,e.telefone,...(e.outrosTel||[])].find(isMobile)||'';
const empPhone=e=>e.celular||e.telefone||'';
const empNome=e=>e.fantasia||e.nome||'Sem nome';
function allParcelas(){const out=[];arr('vendas').forEach(v=>(v.parcelas||[]).forEach((p,i)=>out.push({v,p,i})));return out}
function vendasMes(mk){return arr('vendas').filter(v=>monthKey(v.data)===mk)}
function stats(){
  const mk=curMonth(),vm=vendasMes(mk),t=today();
  const ps=allParcelas();
  const vendido=sum(vm,v=>v.total);
  const aReceber=sum(ps.filter(x=>!x.p.pagoEm),x=>x.p.valor);
  const vencidas=ps.filter(x=>!x.p.pagoEm&&x.p.venc<t);
  const emps=arr('empresas');
  const lucro=sum(vm,lucroVenda);
  return{vendido,lucro,qtd:vm.length,ticket:vm.length?vendido/vm.length:0,aReceber,vencidasValor:sum(vencidas,x=>x.p.valor),vencidasN:vencidas.length,
    recebidoMes:sum(ps.filter(x=>x.p.pagoEm&&monthKey(x.p.pagoEm)===mk),x=>x.p.valor),
    empresas:emps.length,comTel:emps.filter(e=>empPhone(e)).length,comWa:emps.filter(e=>empWhats(e)).length,ufs:new Set(emps.map(e=>e.uf).filter(Boolean)).size,
    novosClientes:arr('clientes').filter(c=>monthKey(iso(new Date(c.criadoEm||0)))===mk).length,
    contatos:emps.filter(e=>monthKey(e.contatadoEm)===mk).length};
}
function maisVendidos(dias=90,n=6){
  const lim=addDays(today(),-dias),m={};
  arr('vendas').filter(v=>v.data>=lim).forEach(v=>(v.itens||[]).forEach(it=>{if(!it.produtoId)return;m[it.produtoId]=(m[it.produtoId]||0)+num(it.qtd)}));
  let list=Object.entries(m).filter(([id])=>get('produtos',id)).sort((a,b)=>b[1]-a[1]).map(([id,q])=>({p:get('produtos',id),q}));
  if(list.length<n){arr('produtos').filter(p=>!m[p.id]).sort((a,b)=>(a.nome||'').localeCompare(b.nome||'')).slice(0,n-list.length).forEach(p=>list.push({p,q:0}))}
  return list.slice(0,n);
}
function precoDiverge(p){return p.precoSugerido>0&&p.preco>0&&Math.abs(p.preco-p.precoSugerido)>=0.01}
function estoqueBaixo(p){return p.controlaEstoque&&num(p.estoque)<=num(p.estoqueMin||0)}

/* ============ notificações ============ */
function notificacoes(){
  const t=today(),out=[],c=S.config;
  const ps=allParcelas().filter(x=>!x.p.pagoEm);
  const venc=ps.filter(x=>x.p.venc<t);
  if(venc.length)out.push({key:'venc-'+t+'-'+venc.length,tone:'warn',icon:'alert',title:`${venc.length} parcela${venc.length>1?'s':''} vencida${venc.length>1?'s':''}`,text:`${brl(sum(venc,x=>x.p.valor))} para cobrar`,go:['cobranca',{tab:'vencidas'}]});
  const prox=ps.filter(x=>x.p.venc>=t&&x.p.venc<=addDays(t,3));
  if(prox.length)out.push({key:'prox-'+t+'-'+prox.length,tone:'gold',icon:'clock',title:`${prox.length} parcela${prox.length>1?'s':''} vence${prox.length>1?'m':''} em até 3 dias`,text:brl(sum(prox,x=>x.p.valor)),go:['cobranca',{tab:'proximas'}]});
  const ret=arr('empresas').filter(e=>e.retorno&&e.retorno<=t&&e.status!=='cliente'&&e.status!=='perdido');
  ret.slice(0,5).forEach(e=>out.push({key:'ret-'+e.id+'-'+e.retorno,tone:'sea',icon:'target',title:`Retornar contato: ${empNome(e)}`,text:e.retorno<t?`Agendado para ${fmtDate(e.retorno)}`:'Agendado para hoje',go:['empresa',{id:e.id}]}));
  if(ret.length>5)out.push({key:'ret-mais-'+t,tone:'sea',icon:'target',title:`+${ret.length-5} retornos de prospecção`,text:'Veja na base de empresas',go:['base',{}]});
  arr('clientes').forEach(cl=>{if(!cl.aniversario)return;const md=cl.aniversario.slice(5);for(let i=0;i<=7;i++){const d=addDays(t,i);if(d.slice(5)===md){out.push({key:'aniv-'+cl.id+'-'+d.slice(0,4),tone:'ok',icon:'cake',title:`Aniversário de ${cl.nome}`,text:i===0?'É hoje! Mande uma mensagem.':`Em ${i} dia${i>1?'s':''} (${fmtShort(d)})`,go:['cliente',{id:cl.id}]});break}}});
  const baixo=arr('produtos').filter(estoqueBaixo);
  if(baixo.length)out.push({key:'est-'+t+'-'+baixo.length,tone:'gold',icon:'box',title:`${baixo.length} produto${baixo.length>1?'s':''} com estoque baixo`,text:baixo.slice(0,3).map(p=>p.nome).join(', '),go:['produtos',{alert:'estoque'}]});
  const div=arr('produtos').filter(precoDiverge);
  if(div.length)out.push({key:'preco-'+div.map(p=>p.id+p.preco).join('').slice(0,60),tone:'gold',icon:'tag',title:`${div.length} produto${div.length>1?'s':''} com preço fora do catálogo`,text:div.slice(0,3).map(p=>p.nome).join(', '),go:['produtos',{alert:'preco'}]});
  const sumidos=arr('clientes').filter(cl=>{const vs=vendasCliente(cl.id);return vs.length&&diffDays(vs[0].data,t)>=60});
  if(sumidos.length)out.push({key:'sumidos-'+t.slice(0,7)+'-'+sumidos.length,tone:'sea',icon:'users',title:`${sumidos.length} cliente${sumidos.length>1?'s':''} sem comprar há 60+ dias`,text:sumidos.slice(0,3).map(c=>c.nome).join(', '),go:['clientes',{sort:'ultima'}]});
  const st=stats(),dia=new Date().getDate(),dim=new Date(new Date().getFullYear(),new Date().getMonth()+1,0).getDate();
  const fmN=metaFat(),alvoN=fmN?metaAlvo(fmN):0,vendN=fatAtual();
  if(alvoN>0){
    if(vendN>=alvoN)out.push({key:'meta-ok-'+curMonth(),tone:'ok',icon:'trophy',title:'Meta do mês batida! 🎉',text:`${brl(vendN)} vendidos de ${brl(alvoN)}`,go:['metas',{}]});
    else if(dia>=dim*0.6)out.push({key:'meta-'+t,tone:'sea',icon:'trophy',title:`Faltam ${brl(alvoN-vendN)} para a meta`,text:`${dim-dia} dia${dim-dia===1?'':'s'} até o fim do mês`,go:['metas',{}]});
  }
  const rc=recompras();
  rc.slice(0,6).forEach(x=>out.push({key:'rec-'+x.c.id+'-'+x.p.id+'-'+x.due,tone:'ok',icon:'clock',title:`Recompra: ${x.c.nome} — ${x.p.nome}`,text:`Comprou há ${x.dias} dias · previsão de fim ${fmtShort(x.due)}`,go:['cliente',{id:x.c.id}]}));
  if(rc.length>6)out.push({key:'rec-mais-'+t,tone:'ok',icon:'clock',title:`+${rc.length-6} recompras previstas`,text:'Veja nas fichas dos clientes',go:['clientes',{}]});
  const cr=carreiraCalc();
  if(dia>=20&&(!cr.preenchido||cr.k.mes!==curMonth()))out.push({key:'vp-conf-'+t,tone:'gold',icon:'star',title:'Confira seu VP do ciclo',text:'Dia 20: veja no Escritório Virtual se a ativação de 50 VP está garantida',go:['carreira',{}]});
  else if(cr.preenchido&&cr.k.mes===curMonth()&&!cr.ativo&&dia>=15)out.push({key:'vp-'+t,tone:'warn',icon:'star',title:`Ativação pendente: faltam ${nf(50-cr.vp)} VP`,text:'Sem ativação você não recebe bônus e os pontos de viagem zeram',go:['carreira',{}]});
  let dis={};try{dis=JSON.parse(ls.get('atl-dismiss')||'{}')}catch(e){}
  return out.filter(n=>!dis[n.key]);
}

function go(route,params={},reset=false){
  if(reset)S.stack=[];else S.stack.push({route:S.route,params:S.params});
  S.route=route;S.params=params||{};
  if(route==='produtos'&&params.alert)S.ui.prodAlert=params.alert;
  if(route==='cobranca'&&params.tab)S.ui.cobTab=params.tab;
  if(route==='clientes'&&params.sort)S.ui.cliSort=params.sort;
  render();window.scrollTo(0,0);
}
function back(){const p=S.stack.pop();if(p){S.route=p.route;S.params=p.params}else{S.route=PARENT[S.route]||'inicio';S.params={}}render();window.scrollTo(0,0)}

}

function filtraEmpresas(){
  const u=S.ui,q=norm(u.baseQ);
  let l=arr('empresas');
  if(u.baseStatus)l=l.filter(e=>(e.status||'novo')===u.baseStatus);
  if(u.baseUf)l=l.filter(e=>e.uf===u.baseUf);
  if(u.baseContato==='tel')l=l.filter(e=>empPhone(e));
  if(u.baseContato==='wa')l=l.filter(e=>empWhats(e));
  if(u.baseContato==='sem')l=l.filter(e=>!empPhone(e));
  if(u.baseContato==='retorno')l=l.filter(e=>e.retorno);
  if(q){const qd=digits(u.baseQ);l=l.filter(e=>norm([e.nome,e.fantasia,e.atividade,e.cidade,e.uf,e.bairro,e.notas].join(' ')).includes(q)||(qd.length>=4&&digits(e.cnpj).includes(qd)))}
  const s=u.baseSort;
  const cmp={recentes:(a,b)=>(b.criadoEm||0)-(a.criadoEm||0),nome:(a,b)=>empNome(a).localeCompare(empNome(b),'pt'),local:(a,b)=>(a.uf||'').localeCompare(b.uf||'')||(a.cidade||'').localeCompare(b.cidade||'','pt'),
    abertNova:(a,b)=>(b.abertura||'').localeCompare(a.abertura||''),abertAntiga:(a,b)=>(a.abertura||'9').localeCompare(b.abertura||'9'),capital:(a,b)=>num(b.capital)-num(a.capital),retorno:(a,b)=>(a.retorno||'9').localeCompare(b.retorno||'9')}[s];
  return l.sort(cmp||(()=>0));
}

/* ---- Vendas ---- */
function filtraVendas(){
  const u=S.ui,t=today();let l=arr('vendas');
  if(u.vendPer==='mes')l=l.filter(v=>monthKey(v.data)===curMonth());
  else if(u.vendPer==='30')l=l.filter(v=>v.data>=addDays(t,-30));
  else if(u.vendPer==='90')l=l.filter(v=>v.data>=addDays(t,-90));
  else if(u.vendPer==='ano')l=l.filter(v=>v.data.slice(0,4)===t.slice(0,4));
  if(u.vendStatus)l=l.filter(v=>vendaStatus(v)===u.vendStatus);
  if(u.vendMin!=='')l=l.filter(v=>v.total>=num(u.vendMin));
  if(u.vendMax!=='')l=l.filter(v=>v.total<=num(u.vendMax));
  if(u.vendQ){const q=norm(u.vendQ);l=l.filter(v=>norm((v.clienteNome||'')+' #'+v.numero+' '+(v.itens||[]).map(i=>i.nome).join(' ')).includes(q))}
  const s=u.vendSort;
  return l.sort(s==='maior'?(a,b)=>b.total-a.total:s==='menor'?(a,b)=>a.total-b.total:(a,b)=>b.data.localeCompare(a.data)||b.numero-a.numero);
}
const ST_V={paga:['Paga','ok'],aberta:['Em aberto','gold'],vencida:['Vencida','warn']};
function vendaRow(v){const st=vendaStatus(v),ps=v.parcelas||[],pg=ps.filter(p=>p.pagoEm).length;

function viewVendas(){

  <div class="scrollx" style="margin-top:12px">${[['mes','Este mês'],['30','30 dias'],['90','90 dias'],['ano','Este ano'],['tudo','Tudo']].map(([k,l])=>`<button class="chip ${u.vendPer===k?'on':''}" data-a="ui" data-k="vendPer" data-v="${k}">${l}</button>`).join('')}</div>
  <div class="scrollx">${[['','Todas'],['aberta','Em aberto'],['vencida','Vencidas'],['paga','Pagas']].map(([k,l])=>`<button class="chip ${u.vendStatus===k?'on':''}" data-a="ui" data-k="vendStatus" data-v="${k}">${l}</button>`).join('')}</div>
  <div class="search">${ic('search',18)}<input class="inp" id="vendQ" data-ui="vendQ" value="${esc(u.vendQ)}" placeholder="Cliente, produto ou nº da venda"></div>
  <div class="filters"><input class="inp" id="vMin" data-ui="vendMin" inputmode="decimal" placeholder="Valor mín. R$" value="${esc(u.vendMin)}"><input class="inp" id="vMax" data-ui="vendMax" inputmode="decimal" placeholder="Valor máx. R$" value="${esc(u.vendMax)}">

  <div class="row" style="margin-top:12px;justify-content:space-between"><span class="small muted"><b>${l.length}</b> venda${l.length===1?'':'s'}</span>${l.length?`<div class="row"><button class="btn sm" data-a="exportVendas" data-f="xlsx">${ic('download',15)} Excel</button><button class="btn sm" data-a="exportVendas" data-f="csv">CSV</button></div>`:''}</div>

     ${p.pagoEm?`<button class="btn sm ghost" data-a="estornar" data-id="${v.id}" data-i="${i}">Estornar</button>`:`<button class="btn sm sea" data-a="baixa" data-id="${v.id}" data-i="${i}">Dar baixa</button>`}</div>`).join('')}

  <button class="btn danger block" data-a="delVenda" data-id="${v.id}">${ic('trash',16)} Excluir venda</button>`;

function comprovante(v){
  const c=S.config,ps=v.parcelas||[];
  let t=`*${c.negocio||'Comprovante'}*\nComprovante de venda #${v.numero}\nData: ${fmtDate(v.data)}\n`;
  if(v.clienteNome)t+=`Cliente: ${v.clienteNome}\n`;
  t+='\n'+(v.itens||[]).map(i=>`${nf(num(i.qtd))}x ${i.nome} — ${brl(num(i.qtd)*num(i.preco))}`).join('\n');
  if(v.desconto)t+=`\nDesconto: − ${brl(v.desconto)}`;
  t+=`\n*Total: ${brl(v.total)}*\nPagamento: ${v.pagamento||''}${ps.length>1?` em ${ps.length}x`:''}`;
  if(ps.length>1||ps.some(p=>!p.pagoEm))t+='\n\n'+ps.map((p,i)=>`${i+1}/${ps.length} · ${fmtDate(p.venc)} · ${brl(p.valor)} ${p.pagoEm?'✓ pago':'(em aberto)'}`).join('\n');
  if(c.vendedor)t+=`\n\nAtendido por ${c.vendedor}`;
  return t+'\n\nObrigado pela preferência!';
}

function newDraft(extra={}){return{clienteId:'',clienteNome:'',data:today(),itens:[],desconto:'',pagamento:'Pix',nParcelas:'1',primeiroVenc:today(),intervalo:'mensal',recebida:true,obs:'',...extra}}
function draftTotals(d){const sub=sum(d.itens,i=>num(i.qtd)*num(i.preco));const total=Math.max(0,round2(sub-num(d.desconto)));return{sub,total}}
function geraParcelas(d,total){
  const n=Math.max(1,Math.min(48,parseInt(d.nParcelas)||1));const base=Math.floor(total/n*100)/100;const out=[];
  for(let i=0;i<n;i++){const valor=i===n-1?round2(total-base*(n-1)):base;const venc=d.intervalo==='mensal'?addMonths(d.primeiroVenc||d.data,i):addDays(d.primeiroVenc||d.data,i*(parseInt(d.intervalo)||30));out.push({valor,venc,pagoEm:(i===0&&d.recebida)?(d.primeiroVenc<=today()?d.primeiroVenc:today()):null})}
  return out;
}

  </div>

    ${d.itens.map((it,i)=>{const p=get('produtos',it.produtoId);const div=p&&p.precoSugerido>0&&Math.abs(num(it.preco)-p.precoSugerido)>=0.01;const semEst=p&&p.controlaEstoque&&num(it.qtd)>num(p.estoque);

      <div class="ctl"><div class="stepper"><button type="button" data-a="qty" data-i="${i}" data-v="-1">−</button><input id="q${i}" inputmode="decimal" data-d="itens.${i}.qtd" value="${esc(it.qtd)}"><button type="button" data-a="qty" data-i="${i}" data-v="1">+</button></div>
      <input class="inp" id="p${i}" inputmode="decimal" data-d="itens.${i}.preco" value="${esc(it.preco)}" aria-label="Preço unitário"><span class="sp"></span><b class="mono">${brl(num(it.qtd)*num(it.preco))}</b></div>
      ${div?`<div class="tiny" style="color:var(--gold);font-weight:700;margin-top:6px">⚠ Preço de catálogo: ${brl(p.precoSugerido)} — pelo contrato a venda é pelo preço de catálogo</div>`:''}

  </div>

    <div class="field"><label for="dPag">Forma</label><select class="inp" id="dPag" data-d="pagamento">${PAGTOS.map(x=>`<option ${d.pagamento===x?'selected':''}>${x}</option>`).join('')}</select></div>

    ${parc.length>1?`<div class="small muted" style="margin-top:6px">${parc.map((p,i)=>`${i+1}ª ${fmtShort(p.venc)} · ${brl(p.valor)}`).join(' &nbsp;|&nbsp; ')}</div>`:''}
    <div class="field" style="margin-top:12px"><label for="dObs">Observações</label><textarea class="inp" id="dObs" data-d="obs" placeholder="Opcional">${esc(d.obs)}</textarea></div>
  </div>
  <div class="stickybar"><div style="flex:1"><div class="small muted">${d.itens.length} ite${d.itens.length===1?'m':'ns'} · lucro est. ${brl(sum(d.itens,i=>num(i.qtd)*(num(i.preco)-custoItem(i)))-num(d.desconto))}</div><div class="big">${brl(total)}</div></div><button class="btn pri" data-a="salvarVenda" ${!d.itens.length||total<=0?'disabled':''}>${ic('check',17)} Salvar venda</button></div>`;

function viewCliente(){
  const c=get('clientes',S.params.id);
  if(!c)return`<div class="empty"><h3>Cliente não encontrado</h3><button class="btn" data-a="back">Voltar</button></div>`;
  const{vs,total,ultima,aberto}=clienteResumo(c),emp=get('empresas',c.empresaId),t=today();

/* ---- metas editáveis ---- */
const TIPOS_META=[['vendido','Faturamento (vendas do mês)','R$'],['lucro','Lucro estimado','R$'],['recebido','Valor recebido no mês','R$'],['qtdVendas','Número de vendas','un'],['clientesAtendidos','Clientes atendidas','un'],['novosClientes','Novos clientes cadastrados','un'],['contatos','Novos contatos de prospecção','un'],['vp','Volume pessoal (VP)','pts'],['manual','Outra meta (eu preencho o valor)','']];
function metasPadrao(c=S.config){return[{id:'m_fat',nome:'Faturamento',tipo:'vendido',alvo:num(c.metaMensal)||3000},{id:'m_cli',nome:'Clientes atendidas',tipo:'clientesAtendidos',alvo:num(c.metaClientes)||25},{id:'m_cont',nome:'Novos contatos',tipo:'contatos',alvo:num(c.metaContatos)||40}]}
const getMetas=()=>Array.isArray(S.config.metas)?S.config.metas:metasPadrao();
const unidadeMeta=m=>m.tipo==='manual'?(m.unidade||'un'):(TIPOS_META.find(t=>t[0]===m.tipo)||['','','un'])[2];
const fmtMeta=(m,v)=>unidadeMeta(m)==='R$'?brl0(v):nf(Math.round(v*100)/100)+(unidadeMeta(m)==='pts'?' pts':'');
function metaBase(tipo,mk){
  const vm=vendasMes(mk);
  switch(tipo){
    case'vendido':return sum(vm,v=>v.total);
    case'lucro':return sum(vm,lucroVenda);
    case'recebido':return sum(allParcelas().filter(x=>x.p.pagoEm&&monthKey(x.p.pagoEm)===mk),x=>x.p.valor);
    case'qtdVendas':return vm.length;
    case'clientesAtendidos':return new Set(vm.map(v=>v.clienteId||v.id)).size;
    case'novosClientes':return arr('clientes').filter(c=>monthKey(iso(new Date(c.criadoEm||0)))===mk).length;
    case'contatos':return arr('empresas').filter(e=>monthKey(e.contatadoEm)===mk).length;
    case'vp':{const k=S.config.carreira;return k&&k.mes===mk?num(k.vp):0}
    default:return 0;
  }
}
const metaAjuste=(m,mk=curMonth())=>num((m.ajustes||{})[mk]);
const metaAtual=(m,mk=curMonth())=>metaBase(m.tipo,mk)+metaAjuste(m,mk);
const metaAlvo=(m,mk=curMonth())=>{const o=(m.alvosMes||{})[mk];return o!=null&&o!==''?num(o):num(m.alvo)};
const metaFat=()=>getMetas().find(m=>m.tipo==='vendido');

let sheetSubmit=null;
function openSheet(title,body,{submit='Salvar',onSubmit=null,extra='',noFooter=false}={}){
  sheetSubmit=onSubmit;
  $('#sheet').innerHTML=`<div class="sheet-bg" data-a="closeSheet"></div><form class="sheet" id="sheetForm" novalidate><div class="sheet-h"><h3>${esc(title)}</h3><button type="button" class="icon-btn" data-a="closeSheet" aria-label="Fechar">${ic('x',20)}</button></div><div class="sheet-b">${body}</div>${noFooter?'':`<div class="sheet-f">${extra}${onSubmit?`<button class="btn pri" type="submit">${esc(submit)}</button>`:''}</div>`}</form>`;
  document.body.style.overflow='hidden';
  const f=$('#sheetForm input:not([type=hidden]):not([type=file]):not([type=checkbox]),#sheetForm textarea');if(f&&!f.readOnly&&window.innerWidth>700)f.focus();
}
function closeSheet(){$('#sheet').innerHTML='';sheetSubmit=null;document.body.style.overflow=''}
const F=(name,label,val='',o={})=>{const id='f_'+name;
  if(o.type==='select')return`<div class="field"><label for="${id}">${label}</label><select class="inp" id="${id}" name="${name}">${o.options.map(x=>{const[v,l]=Array.isArray(x)?x:[x,x];return`<option value="${esc(v)}" ${String(v)===String(val??'')?'selected':''}>${esc(l)}</option>`}).join('')}</select></div>`;
  if(o.type==='textarea')return`<div class="field"><label for="${id}">${label}</label><textarea class="inp" id="${id}" name="${name}" placeholder="${esc(o.ph||'')}">${esc(val)}</textarea></div>`;
  if(o.type==='check')return`<label class="check"><input type="checkbox" name="${name}" ${val?'checked':''}> ${label}</label>`;
  return`<div class="field"><label for="${id}">${label}${o.req?' *':''}</label><input class="inp" id="${id}" name="${name}" type="${o.type||'text'}" value="${esc(val)}" ${o.im?`inputmode="${o.im}"`:''} ${o.list?`list="${o.list}"`:''} placeholder="${esc(o.ph||'')}"></div>`};
function confirmSheet(msg,onYes,label='Excluir'){openSheet('Tem certeza?',`<p style="margin:0">${msg}</p>`,{submit:label,onSubmit:()=>{onYes();closeSheet()}})}

function formEmpresa(id,pre={}){
  const e=id?get('empresas',id):{cnpj:pre.cnpj||'',status:'novo'};
  openSheet(id?'Editar empresa':'Adicionar empresa',`
   ${F('nome','Razão social',e.nome,{req:1})}${F('fantasia','Nome fantasia',e.fantasia)}${F('cnpj','CNPJ',e.cnpj?fmtCnpj(e.cnpj):'',{im:'numeric'})}${F('atividade','Atividade / segmento',e.atividade)}
   <div class="grid2">${F('cidade','Cidade',e.cidade)}${F('uf','UF',e.uf||'',{type:'select',options:[['',''],...UFS]})}</div>
   ${F('endereco','Endereço',e.endereco)}${F('bairro','Bairro',e.bairro)}
   <div class="grid2">${F('telefone','Telefone',e.telefone?fmtPhone(e.telefone):'',{im:'tel'})}${F('celular','Celular / WhatsApp',e.celular?fmtPhone(e.celular):'',{im:'tel'})}</div>
   ${F('email','E-mail',e.email,{type:'email'})}
   <div class="grid2">${F('abertura','Data de abertura',e.abertura,{type:'date'})}${F('porte','Porte',e.porte||'',{type:'select',options:['','MEI','ME','EPP','Demais']})}</div>
   ${F('capital','Capital social (R$)',e.capital||'',{im:'decimal'})}`,
   {onSubmit:v=>{
     if(!v.nome.trim()&&!v.fantasia.trim())return toast('Informe o nome da empresa.');
     const cn=digits(v.cnpj);if(cn&&!id&&arr('empresas').some(x=>digits(x.cnpj)===cn))return toast('Esse CNPJ já está na base.');
     const o={...(e||{}),...v,cnpj:cn,capital:v.capital?num(v.capital):'',telefone:normPhone(v.telefone),celular:normPhone(v.celular),id:id||newId('e'),criadoEm:e.criadoEm||Date.now(),status:e.status||'novo'};
     Store.put('empresas',o);closeSheet();toast(id?'Empresa atualizada':'Empresa adicionada à base');
     if(!id){S.cnpj=null;go('empresa',{id:o.id})}else render();
   }});
}

async function hash(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('atl:'+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=7;for(const ch of 'atl:'+s)h=(h*31+ch.charCodeAt(0))|0;return 'f'+(h>>>0).toString(16)}}

function montarCatalogo(){
  const now=Date.now(),list=[];
  ATL_CAT.forEach(g=>{const ciclo=CICLO[g.l]||45;

let XLSXp=null;
function loadXLSX(){if(window.XLSX)return Promise.resolve(window.XLSX);if(!XLSXp)XLSXp=new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=()=>res(window.XLSX);s.onerror=()=>{XLSXp=null;rej(new Error('Não foi possível carregar o leitor de Excel.'))};document.head.appendChild(s)});return XLSXp}
function parseCSV(text){
  text=text.replace(/^﻿/,'');const first=text.split(/\r?\n/)[0]||'';const dl=(first.split(';').length>first.split(',').length)?';':(first.includes('\t')?'\t':',');
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}
    else if(ch==='"')q=true;else if(ch===dl){row.push(f);f=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}else f+=ch}
  if(f||row.length){row.push(f);rows.push(row)}
  const hd=(rows.shift()||[]).map(h=>h.trim());
  return rows.filter(r=>r.some(c=>c.trim())).map(r=>Object.fromEntries(hd.map((h,i)=>[h,(r[i]||'').trim()])));
}
const KEYMAP={nome:['razaosocial','razao','nomeempresarial','empresa','nome','name'],fantasia:['nomefantasia','fantasia'],cnpj:['cnpj','cnpjbasico'],
  atividade:['atividade','atividadeprincipal','descricaoatividade','cnaedescricao','descricaocnae','cnaeprincipaldescricao','segmento','ramo','cnae','cnaeprincipal'],
  cidade:['cidade','municipio','city'],uf:['uf','estado','state'],bairro:['bairro'],endereco:['endereco','logradouro','enderecocompleto'],
  telefone:['telefone','telefone1','fone','phone','ddd1telefone1','telefones','telefoneprincipal'],celular:['celular','whatsapp','mobile','telefone2','ddd2telefone2'],
  email:['email','correioeletronico'],abertura:['abertura','dataabertura','datadeabertura','datainicioatividade','inicioatividade','dataaberturaempresa'],
  porte:['porte','porteempresa','portedaempresa'],capital:['capitalsocial','capital'],contato:['contato','contatos'],local:['local','localizacao','cidadeuf'],status:['status','situacaonafunil'],notas:['notas','observacoes','obs']};
function mapRow(r){
  const nk={};Object.keys(r).forEach(k=>{nk[norm(k).replace(/[^a-z0-9]/g,'')]=r[k]});
  const g=f=>{for(const k of KEYMAP[f]){if(nk[k]!=null&&String(nk[k]).trim()!=='')return nk[k]}return''};
  const e={nome:String(g('nome')).trim(),fantasia:String(g('fantasia')).trim(),cnpj:digits(g('cnpj')),atividade:String(g('atividade')).trim(),cidade:String(g('cidade')).trim(),uf:String(g('uf')).trim().toUpperCase().slice(0,2),bairro:String(g('bairro')).trim(),endereco:String(g('endereco')).trim(),email:String(g('email')).trim().toLowerCase(),abertura:parseDate(g('abertura')),porte:String(g('porte')).trim(),capital:g('capital')!==''?num(g('capital')):'',notas:String(g('notas')).trim()};
  const loc=String(g('local'));if(loc&&(!e.cidade||!e.uf)){const m=loc.match(/^(.*?)\s*[\/\-–,]\s*([A-Za-z]{2})\s*$/);if(m){e.cidade=e.cidade||m[1].trim();e.uf=e.uf||m[2].toUpperCase()}else if(!e.cidade)e.cidade=loc.trim()}
  const cont=String(g('contato'));const telsRaw=[g('telefone'),g('celular'),cont].join(' ');
  const tels=[...new Set((telsRaw.match(/(?:\+?55\s?)?\(?\d{2}\)?[\s.-]?9?\d{4}[\s.-]?\d{4}/g)||[]).map(normPhone).filter(x=>x.length>=10))];
  e.celular=tels.find(isMobile)||'';e.telefone=tels.find(t=>t!==e.celular)||'';e.outrosTel=tels.filter(t=>t!==e.celular&&t!==e.telefone);
  if(!e.email){const m=cont.match(/[\w.+-]+@[\w-]+\.[\w.]+/);if(m)e.email=m[0].toLowerCase()}
  if(e.cnpj.length>=12&&e.cnpj.length<14)e.cnpj=e.cnpj.padStart(14,'0');
  if(e.nome.toUpperCase()===e.nome&&e.nome.length>3)e.nome=e.nome.toLowerCase().replace(/(^|\s)\S/g,s=>s.toUpperCase());
  return e;
}
async function readFileRows(file){
  const name=file.name.toLowerCase();
  if(name.endsWith('.json')){const j=JSON.parse(await file.text());if(j&&j.app==='atlantica-vendas')return{backup:j};const list=Array.isArray(j)?j:(j.empresas||j.data||j.results||j.resultados||Object.values(j).find(Array.isArray)||[]);return{rows:list.map(x=>{const f={};Object.entries(x||{}).forEach(([k,v])=>{f[k]=v&&typeof v==='object'?(Array.isArray(v)?v.map(y=>typeof y==='object'?Object.values(y).join(' '):y).join(' '):Object.values(v).join(' ')):v});return f})}}
  if(name.endsWith('.xlsx')||name.endsWith('.xls')){const X=await loadXLSX();const wb=X.read(await file.arrayBuffer(),{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];return{rows:X.utils.sheet_to_json(ws,{defval:'',raw:true})}}
  return{rows:parseCSV(await file.text())};
}
async function handleImport(file){
  try{
    toast('Lendo arquivo…');
    const r=await readFileRows(file);
    if(r.backup)return restoreBackup(r.backup);
    const mapped=r.rows.map(mapRow).filter(e=>e.nome||e.fantasia);
    const have=new Set(arr('empresas').map(e=>digits(e.cnpj)).filter(Boolean));const haveN=new Set(arr('empresas').map(e=>norm(empNome(e)+'|'+e.cidade)));
    const novas=[];let dup=0;
    mapped.forEach(e=>{const k=e.cnpj||'';const kn=norm(empNome(e)+'|'+e.cidade);if((k&&have.has(k))||(!k&&haveN.has(kn))){dup++;return}if(k)have.add(k);haveN.add(kn);novas.push(e)});
    if(!mapped.length)return openSheet('Nada para importar',`<p class="mt0">Não encontrei empresas nesse arquivo. Ele precisa ter uma coluna de nome/razão social (e de preferência CNPJ, cidade, UF, telefone).</p>`,{});
    const prev=novas.slice(0,5).map(e=>`<div class="notif"><div class="ico">${ic('target',16)}</div><div class="tx"><b>${esc(empNome(e))}</b><span>${esc([e.cidade,e.uf].filter(Boolean).join('/'))} ${e.celular?'· WhatsApp':e.telefone?'· telefone':''}</span></div></div>`).join('');
    openSheet('Importar empresas',`<div class="grid2"><div class="stat good"><div class="l">Novas</div><div class="v">${nf(novas.length)}</div></div><div class="stat"><div class="l">Já na base</div><div class="v">${nf(dup)}</div></div></div>
      <div class="small muted" style="margin:12px 0 4px">Com celular/WhatsApp: <b>${novas.filter(e=>e.celular).length}</b> · com telefone: <b>${novas.filter(e=>e.celular||e.telefone).length}</b></div>${prev}${novas.length>5?`<p class="small muted">e mais ${nf(novas.length-5)}…</p>`:''}`,
      {submit:novas.length?`Importar ${nf(novas.length)}`:'Fechar',onSubmit:async()=>{
        if(!novas.length)return closeSheet();
        closeSheet();const now=Date.now();
        const objs=novas.map((e,i)=>({...e,id:newId('e'),status:'novo',criadoEm:now-i}));
        await Store.bulkPut('empresas',objs,n=>toast(`Importando… ${n}/${objs.length}`));
        toast(`${nf(objs.length)} empresas importadas`);S.ui.baseSort='recentes';render();
      }});
  }catch(err){console.error(err);toast(err.message||'Não consegui ler esse arquivo.')}
}

async function exportRows(base,rows,fmt){
  const stamp=today();let data,fname=`${base}-${stamp}.${fmt}`;
  try{
    if(fmt==='json')data=JSON.stringify(rows,null,2);
    else if(fmt==='csv'){const hd=Object.keys(rows[0]||{});const q=v=>{const s=String(v??'');return/[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};data='﻿'+[hd.map(q).join(';'),...rows.map(r=>hd.map(h=>q(r[h])).join(';'))].join('\r\n')}
    else{const X=await loadXLSX();const ws=X.utils.json_to_sheet(rows);ws['!cols']=Object.keys(rows[0]||{}).map(k=>({wch:Math.min(40,Math.max(10,k.length+2))}));const wb=X.utils.book_new();X.utils.book_append_sheet(wb,ws,base.slice(0,30));data=new Uint8Array(X.write(wb,{bookType:'xlsx',type:'array'}))}
  }catch(e){return toast(e.message||'Falha ao gerar arquivo')}
  await saveFile(fname,data,fmt!=='xlsx'?data:null);
}
async function saveFile(fname,data,textFallback){
  try{
    const ext=fname.split('.').pop();const type={csv:'text/csv;charset=utf-8',json:'application/json',xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}[ext]||'application/octet-stream';
    const blob=data instanceof Blob?data:new Blob([data],{type});
    const file=typeof File!=='undefined'?new File([blob],fname,{type}):null;
    if(file&&navigator.canShare&&navigator.canShare({files:[file]})&&/iPhone|iPad|Android/i.test(navigator.userAgent)){try{await navigator.share({files:[file],title:fname});return}catch(e){if(e&&e.name==='AbortError')return}}
    const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=fname;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);toast('Arquivo baixado ✓');
  }catch(e){if(textFallback){try{await navigator.clipboard.writeText(String(textFallback).replace(/^﻿/,''));toast('Conteúdo copiado.')}catch(x){toast('Não consegui gerar o arquivo.')}}else toast('Não consegui gerar o arquivo.')}
}

function restoreBackup(j){

   {submit:'Restaurar',onSubmit:async()=>{closeSheet();for(const k of KINDS){const l=Object.values((j.data||{})[k]||{});if(l.length)await Store.bulkPut(k,l,n=>toast(`Restaurando ${k}… ${n}`))}if(j.config){const{pinHash,...rest}=j.config;await Store.setConfig(rest)}toast('Backup restaurado ✓');render()}});
}
function compressImage(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const m=360,s=Math.min(1,m/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.78))};img.onerror=rej;img.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}

function setDraft(path,val){const parts=path.split('.');let o=S.draft;for(let i=0;i<parts.length-1;i++)o=o[parts[i]];o[parts[parts.length-1]]=val;
  if(path==='nParcelas'&&parseInt(val)>1&&S.draft.primeiroVenc<=S.draft.data){S.draft.primeiroVenc=S.draft.data;S.draft.recebida=S.draft.pagamento!=='Fiado / a prazo'&&S.draft.pagamento!=='Boleto'}
  if(path==='pagamento'){if(val==='Fiado / a prazo'||val==='Boleto'){S.draft.recebida=false;if(S.draft.primeiroVenc<=S.draft.data)S.draft.primeiroVenc=addMonths(S.draft.data,1)}else if(parseInt(S.draft.nParcelas)===1){S.draft.recebida=true;S.draft.primeiroVenc=S.draft.data}}
  if(path==='data'&&parseInt(S.draft.nParcelas)===1&&S.draft.recebida)S.draft.primeiroVenc=val;
}

  if(f.id==='buscaForm'){lerBuscaForm();if(S.busca.tab==='receita'&&!S.busca.seg.length&&!S.busca.texto&&!S.busca.cidade){toast('Escolha um segmento, uma cidade ou um nome.');return}executarBusca(false);return}
  if(f.id==='carForm'){const fd=Object.fromEntries(new FormData(f));const k={};['vp','vq','linhas','maior','viagem'].forEach(x=>k[x]=num(fd[x]));k.mes=curMonth();Store.setConfig({carreira:k});toast('Painel de carreira atualizado');render();return}
  if(f.id==='cfgForm'){const fd=Object.fromEntries(new FormData(f));Store.setConfig({...fd,whatsapp:normPhone(fd.whatsapp),categorias:String(fd.categorias||'').split(',').map(s=>s.trim()).filter(Boolean),atlanticaUrl:(fd.atlanticaUrl||DEF_CONFIG.atlanticaUrl).trim()});toast('Ajustes salvos');render();return}
});

/* ============ início ============ */
render();
Store.init().catch(e=>{console.error(e);S.ready=true;S.needLogin=true;S.loginErro='Não consegui conectar. Verifique a internet.';render()});
</script>
</body>
</html>
