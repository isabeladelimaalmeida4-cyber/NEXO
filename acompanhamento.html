<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4EEE8">
<link rel="icon" href="assets/marca/nexo-simbolo.svg" type="image/svg+xml">
<title>NEXO · Controle de acompanhamento</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Work+Sans:wght@300;400;500;600&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: mesma família do Controle de clientes — cabeçalho com fio champagne, cards que filtram,
   um único bloco escuro — e, abaixo, duas colunas: a lista de contratos e a ficha do cliente escolhido. */
:root{
  --paper:#F4EEE8; --card:#FBF8F5; --edge:#D5C9C7; --soft:#E6DDD7;
  --ink:#1F090B; --text:#3A181D; --muted:#72585A;
  --champ:#C6A16A; --on-champ:#1F090B; --rule:rgba(198,161,106,.85);
  --band-bg:#1F090B; --band-fg:#F4EEE8; --band-sub:#D5C9C7; --band-edge:#1F090B;
  --late-bg:#1F090B; --late-fg:#F4EEE8;
  --s1:#C6A16A; --s2:#6B2A33; --veil:rgba(31,9,11,.5);
  --logo-l:block; --logo-d:none;
  --serif:"Playfair Display",Georgia,"Times New Roman",serif;
  --sans:"Work Sans",Arial,Helvetica,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#1F090B; --card:#2B1014; --edge:#4F2D32; --soft:#3B1D22;
    --ink:#F4EEE8; --text:#E4D7D0; --muted:#B59E99;
    --champ:#C6A16A; --on-champ:#1F090B; --rule:rgba(198,161,106,.6);
    --band-bg:#2B1014; --band-fg:#F4EEE8; --band-sub:#D5C9C7; --band-edge:rgba(198,161,106,.6);
    --late-bg:#F4EEE8; --late-fg:#1F090B;
    --s1:#C6A16A; --s2:#EFE6DF; --veil:rgba(0,0,0,.62);
    --logo-l:none; --logo-d:block;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#1F090B; --card:#2B1014; --edge:#4F2D32; --soft:#3B1D22;
  --ink:#F4EEE8; --text:#E4D7D0; --muted:#B59E99;
  --champ:#C6A16A; --on-champ:#1F090B; --rule:rgba(198,161,106,.6);
  --band-bg:#2B1014; --band-fg:#F4EEE8; --band-sub:#D5C9C7; --band-edge:rgba(198,161,106,.6);
  --late-bg:#F4EEE8; --late-fg:#1F090B;
  --s1:#C6A16A; --s2:#EFE6DF; --veil:rgba(0,0,0,.62);
  --logo-l:none; --logo-d:block;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--paper)}
body{margin:0;font-family:var(--sans);font-weight:400;font-size:15px;line-height:1.55;color:var(--text);-webkit-font-smoothing:antialiased}
.wrap{max-width:1240px;margin:0 auto;padding-inline:20px;padding-block:22px 72px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.label{font-weight:600;font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--text)}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;padding-bottom:14px;border-bottom:1px solid var(--rule)}
.head img{width:150px;height:auto}
.logo-l{display:var(--logo-l)} .logo-d{display:var(--logo-d)}

.hero{padding-block:36px 0}
h1,h2,h3{font-family:var(--serif);color:var(--ink);text-wrap:balance;margin:0}
h1{font-weight:700;font-size:clamp(30px,5.2vw,46px);line-height:1.1;margin-top:10px}
h2{font-weight:700;font-size:clamp(24px,3.2vw,30px);line-height:1.15}
h3{font-weight:600;font-size:19px;line-height:1.25}
h1 em,h2 em{font-style:italic;font-weight:500;color:var(--text)}
.lead{font-weight:300;font-size:17px;max-width:64ch;margin:14px 0 0}
.graf{display:block;width:min(420px,100%);height:auto;margin-top:24px}
.graf line,.graf polyline{stroke:var(--champ)} .graf circle{fill:var(--champ)}
.graf circle.oco{fill:var(--paper);stroke:var(--champ);stroke-width:1.2}

/* cards que filtram a lista */
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:28px}
.tab{appearance:none;text-align:left;background:var(--card);border:1px solid var(--edge);border-radius:16px;padding:18px 20px 16px;cursor:pointer;display:flex;flex-direction:column;gap:8px;min-width:0}
.tab .label{display:flex;align-items:center;gap:9px}
.tab .label::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;border:1.5px solid var(--champ)}
.tab[aria-pressed="true"]{border-color:var(--ink)}
.tab[aria-pressed="true"] .label::before{background:var(--champ)}
.tab .n{font-family:var(--serif);font-weight:600;font-size:42px;line-height:1;color:var(--ink);font-variant-numeric:lining-nums tabular-nums}
.tab .t{font-size:13.5px}

/* o único bloco escuro da peça */
.band{margin-top:14px;background:var(--band-bg);border:1px solid var(--band-edge);border-radius:18px;padding:22px 26px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.band .label{color:var(--champ);display:block}
.band .n{font-family:var(--serif);font-weight:600;font-size:28px;line-height:1.2;color:var(--band-fg);margin-top:6px;font-variant-numeric:lining-nums tabular-nums;overflow-wrap:anywhere}
.band .t{color:var(--band-sub);font-weight:300;font-size:13.5px}

.section{margin-top:44px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:20px}
.search{flex:1 1 220px;min-width:0;background:var(--card);border:1px solid var(--edge);border-radius:999px;padding:10px 18px;font-size:16px}
.search::placeholder{color:var(--muted)}
.cta{appearance:none;border:0;background:var(--champ);color:var(--on-champ);font-weight:600;font-size:14.5px;border-radius:999px;padding:12px 24px;cursor:pointer}
.btn{appearance:none;border:1px solid var(--edge);background:transparent;color:var(--ink);font-weight:500;font-size:12.5px;border-radius:999px;padding:7px 14px;cursor:pointer;white-space:nowrap}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btn.quiet{border-color:transparent;color:var(--muted);padding-inline:8px}
button:disabled{opacity:.55;cursor:default}

.note{margin-top:16px;background:var(--card);border:1px solid var(--edge);border-radius:14px;padding:12px 18px;font-size:13.5px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.note span{flex:1 1 240px;min-width:0}

/* duas colunas: lista e ficha */
.split{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:30px;align-items:start;margin-top:18px}
.split>*{min-width:0}
.list{border-top:1px solid var(--rule)}
.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 18px;padding:16px 14px;border-bottom:1px solid var(--edge);cursor:pointer}
.row>*{min-width:0}
.row.sel{background:var(--card);box-shadow:inset 0 0 0 1px var(--ink);border-bottom-color:transparent;border-radius:14px}
.row .main,.row .acts{grid-column:1/-1}
.row .main{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:flex-start;justify-content:space-between}
.row .quem{min-width:0;flex:1 1 180px}
.nomebtn{appearance:none;background:none;border:0;padding:0;text-align:left;cursor:pointer;font-family:var(--serif);font-weight:600;font-size:19px;line-height:1.25;color:var(--ink);overflow-wrap:anywhere}
.k{display:block;font-size:10px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.v{font-size:14.5px;color:var(--ink);overflow-wrap:anywhere}
.sub{font-size:13.5px;display:flex;flex-wrap:wrap;gap:2px 14px;margin-top:3px;color:var(--muted)}
.sub a{color:var(--text);text-decoration:underline;text-underline-offset:3px;overflow-wrap:anywhere}
.frac{font-family:var(--serif);font-weight:600;font-size:22px;line-height:1.1;color:var(--ink);font-variant-numeric:lining-nums tabular-nums}
.frac small{font-family:var(--sans);font-weight:400;font-size:12.5px;color:var(--muted);margin-left:6px}
.trk{height:6px;border-radius:3px;background:var(--soft);margin-top:7px;overflow:hidden}
.trk i{display:block;height:100%;border-radius:3px;background:var(--champ)}
.trk.tempo i{background:var(--ink)}
.acts{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.acts .sp{margin-left:auto}
.pills{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pill{display:inline-block;border-radius:999px;padding:3px 12px;font-size:12.5px;font-weight:500;line-height:1.5;white-space:nowrap}
.pill.a{background:var(--champ);color:var(--on-champ);font-weight:600}
.pill.b{background:var(--soft);color:var(--text)}
.pill.c{border:1px solid var(--edge);color:var(--text)}
.pill.late{background:var(--late-bg);color:var(--late-fg);font-weight:600}
.tag{font-family:var(--sans);font-size:10px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);border:1px solid var(--edge);border-radius:999px;padding:2px 9px;margin-left:8px;vertical-align:middle;white-space:nowrap}

.empty{padding:44px 20px;text-align:center;border-bottom:1px solid var(--edge)}
.empty b{display:block;font-family:var(--serif);font-weight:600;font-size:21px;color:var(--ink)}
.empty p{margin:6px auto 0;max-width:46ch}

/* ficha do cliente (coluna da direita) */
.painel{background:var(--card);border:1px solid var(--edge);border-radius:20px;padding:26px 28px 24px;position:sticky;top:calc(16px + env(safe-area-inset-top,0px))}
.painel .topo{display:flex;justify-content:space-between;align-items:center;gap:10px}
.painel h2{margin-top:8px;overflow-wrap:anywhere}
.voltar{display:none}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:22px;padding-block:18px;border-block:1px solid var(--rule)}
.stats>div{min-width:0}
.stats .frac{font-size:32px}
.stats .t{font-size:13px;margin-top:7px;color:var(--text)}
.bloco{margin-top:28px}
.bloco .cab{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 14px}
.bloco .cab p{margin:0;font-size:13.5px;color:var(--muted)}
.fats{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin-top:14px}
.fc{appearance:none;text-align:left;background:var(--paper);border:1px solid var(--edge);border-radius:12px;padding:9px 11px;cursor:pointer;display:flex;flex-direction:column;gap:1px;min-width:0;color:var(--ink)}
.fc b{font-family:var(--serif);font-weight:600;font-size:17px;line-height:1.2;font-variant-numeric:lining-nums tabular-nums}
.fc span{font-size:12px;font-variant-numeric:tabular-nums}
.fc em{font-style:normal;font-size:11.5px;font-weight:600;margin-top:3px}
.fc.paga{background:var(--champ);border-color:var(--champ);color:var(--on-champ)}
.fc.atras{background:var(--late-bg);border-color:var(--late-bg);color:var(--late-fg)}
.fc.futura span,.fc.futura em{color:var(--muted)}

.chart{position:relative;margin-top:12px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:var(--sans);font-variant-numeric:tabular-nums}
.tip{position:absolute;z-index:3;pointer-events:none;background:var(--late-bg);color:var(--late-fg);border-radius:10px;padding:8px 12px;font-size:12.5px;line-height:1.45;width:max-content;max-width:220px;transform:translate(-50%,-100%)}
.tip b{display:block;font-weight:600}
.leg{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:12.5px;color:var(--text);margin-top:10px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px;vertical-align:-1px}
.quad{display:flex;gap:8px;margin-top:12px}
.quad div{min-width:0;flex:1 1 0;border-top:1px solid var(--rule);padding-top:7px}
.quad .v{font-size:13px}

.addA{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr);gap:10px 12px;margin-top:14px}
.addA .full{grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap}
.addA .full input{flex:1 1 200px;min-width:0}
.inp{width:100%;font-size:16px;padding:10px 12px;border:1px solid var(--edge);border-radius:10px;background:var(--paper);color:var(--ink)}
.alist{margin-top:14px;border-top:1px solid var(--edge)}
.aitem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:11px 0;border-bottom:1px solid var(--edge);align-items:center}
.aitem .d{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.aitem p{margin:2px 0 0;font-size:14px;color:var(--ink);overflow-wrap:anywhere}
.dl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 18px;margin-top:14px}
.dl>div{min-width:0}
.obs{font-size:13.5px;color:var(--muted);margin:14px 0 0;overflow-wrap:anywhere}
.fim{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:26px;padding-top:16px;border-top:1px solid var(--rule)}

.foot{margin-top:56px;padding-top:14px;border-top:1px solid var(--rule);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.foot .label{font-weight:400;font-size:10px;color:var(--muted)}
.bkp{margin-top:22px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:13.5px;color:var(--muted)}
.bkp span{flex:1 1 260px;min-width:0}

/* formulário do cliente */
.ov{position:fixed;inset:0;z-index:20;background:var(--veil);display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet{background:var(--paper);border:1px solid var(--edge);border-radius:20px;width:min(680px,100%);padding:26px 26px 22px}
.sheet h2{margin-top:8px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px;margin-top:22px}
.field{display:flex;flex-direction:column;min-width:0}
.field.full{grid-column:1/-1}
.field input,.field select,.field textarea{width:100%;font-size:16px;padding:10px 12px;border:1px solid var(--edge);border-radius:10px;background:var(--card);color:var(--ink)}
.field textarea{min-height:76px;resize:vertical}
.sep{grid-column:1/-1;border-top:1px solid var(--rule);padding-top:14px;margin-top:4px}
.hint{grid-column:1/-1;font-size:13.5px;color:var(--text);background:var(--card);border:1px solid var(--edge);border-radius:12px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.hint span{flex:1 1 220px;min-width:0}
.sheet .end{display:flex;justify-content:flex-end;gap:10px;margin-top:22px;flex-wrap:wrap;align-items:center}
.err{color:var(--ink);font-weight:500;font-size:13.5px;margin-right:auto}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;background:var(--late-bg);color:var(--late-fg);border-radius:999px;padding:10px 20px;font-size:13.5px;max-width:calc(100% - 32px);text-align:center}

@media (max-width:1020px){
  .split{grid-template-columns:minmax(0,1fr)}
  .painel{display:none;position:fixed;inset:0;z-index:15;border:0;border-radius:0;overflow:auto;background:var(--paper);padding:calc(18px + env(safe-area-inset-top,0px)) 20px calc(40px + env(safe-area-inset-bottom,0px))}
  .painel.aberto{display:block}
  .voltar{display:inline-block}
  html.trava,html.trava body{overflow:hidden}
}
@media (max-width:760px){
  .head img{width:128px}
  .label{font-size:10px;letter-spacing:.22em}
  .tabs{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .tab{padding:14px 14px 12px;border-radius:14px}
  .tab .label{font-size:9px;letter-spacing:.12em;gap:6px}
  .tab .label::before{width:6px;height:6px}
  .tab .n{font-size:32px}
  .tab .t{display:none}
  .band{grid-template-columns:1fr;gap:14px;padding:20px}
  .stats{grid-template-columns:1fr;gap:16px}
  .dl{grid-template-columns:repeat(2,minmax(0,1fr))}
  .form{grid-template-columns:1fr}
  .sheet{padding:22px 18px 18px}
  .addA{grid-template-columns:1fr}
  .quad{flex-wrap:wrap}
  .quad div{flex:1 1 40%}
}
@media (prefers-reduced-motion:no-preference){.tab,.btn,.cta,.fc{transition:border-color .15s,background-color .15s}}
</style>
</head>

      ev.preventDefault();
      var nome = F.nome.value.trim();
      if (!nome) { erro.textContent = "Informe o nome do cliente."; F.nome.focus(); return; }
      if (!dt(F.inicio.value)) { erro.textContent = "Informe a data de início do acompanhamento."; F.inicio.focus(); return; }

      c.inicio = F.inicio.value; c.meses = int(F.meses.value, DURACAO, 1, 60); c.faturas = int(F.faturas.value, DURACAO, 0, 120);
      c.primeiroVenc = dt(F.primeiroVenc.value) ? F.primeiroVenc.value : c.inicio;
      c.obs = F.obs.value.trim().slice(0, 1000);
      var ja = int(F.jaPagas.value, 0, 0, c.faturas), velhas = c.pagas || {}, n, limpas = {};
      if (kAnt && ja === kAnt.pagas) { for (n in velhas) if (+n <= c.faturas) limpas[n] = velhas[n]; }
      else for (n = 1; n <= ja; n++) limpas[n] = velhas[n] || hoje();
      c.pagas = limpas;
      if (novo) { c.id = novoId("a"); c.criadoEm = hoje(); }
      delete c.exemplo;
      S.sel = c.id; if (novo) { S.filtro = calc(normal(c), hoje()).encerrado ? "encerrados" : "ativos"; S.busca = ""; $("busca").value = ""; }
      sair();

    }
    var folha = h("form", { class: "sheet", novalidate: true, onsubmit: salvar },
      h("span", { class: "label", text: novo ? "Novo cliente" : "Editar cliente" }),
      h("h2", null, novo ? "Começar um " : "Ajustar o ", h("em", { text: "acompanhamento." })),
      grade,
      h("div", { class: "end" }, erro, h("button", { class: "btn", type: "button", text: "Cancelar", onclick: sair }), h("button", { class: "cta", type: "submit", text: novo ? "Adicionar cliente" : "Salvar" })));
    var ov = h("div", { class: "ov", role: "dialog", "aria-modal": "true", "aria-label": novo ? "Novo cliente" : "Editar cliente", onmousedown: function (ev) { if (ev.target === ov) sair(); } }, folha);
    $("ficha").textContent = ""; $("ficha").appendChild(ov);
    document.addEventListener("keydown", esc);
    F.nome.focus();
  }

  /* ---------- pintura geral ---------- */

    if (S.pronto) { // a linha escolhida só é conhecida depois da ficha
      var L = $("lista"); Array.prototype.forEach.call(L.querySelectorAll(".row"), function (r, i) { r.classList.toggle("sel", vis[i] && vis[i].c.id === S.sel); });
    }
    $("novo").hidden = S.leitura || !S.pronto;
    ["baixar", "restaurar", "trazer"].forEach(function (id) { $(id).hidden = !S.pronto || (S.leitura && id !== "baixar"); });
    $("copiar-link").hidden = !(S.pronto && S.link);
    $("bkp-txt").textContent = !S.pronto ? "" : S.link ? "Os contratos ficam salvos na nuvem: qualquer aparelho que abrir o link de acesso vê a última versão. Baixe uma cópia de vez em quando, por segurança."
      : S.nuvem ? "Os contratos ficam salvos na sua conta e aparecem em qualquer aparelho. Baixe uma cópia de vez em quando, por segurança."
      : "Os contratos ficam guardados neste navegador. Baixe uma cópia de vez em quando para não perder nada.";
    $("status").textContent = S.erro ? "Sem acesso aos dados" : !S.pronto ? "Carregando" : S.link ? (S.semRede ? "Sem conexão com a nuvem" : "Salvo na nuvem") : S.nuvem ? "Salvo na sua conta" : "Salvo neste navegador";
  }

  /* ---------- cópia de segurança e importação ---------- */
  function baixar() {
    var nome = "nexo-acompanhamento-" + hoje() + ".json";
    var txt = JSON.stringify({ nexo: "controle-de-acompanhamento", versao: 1, clientes: S.clientes }, null, 2);
    var porLink = function () {
      var blob = new Blob([txt], { type: "application/json" }), a = h("a", { href: URL.createObjectURL(blob), download: nome });
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
    };
    if (!(window.claude && typeof window.claude.use === "function")) { porLink(); return; }
    window.claude.use("downloads").then(function (d) {
      if (!d) { toast("Este aparelho não permite baixar a cópia por aqui."); return; }
      return d.save({ filename: nome, data: txt }).then(function () { toast("Cópia salva."); });
    }).catch(function (e) { if (!e || e.code !== "declined") toast("Não foi possível baixar a cópia agora."); });
  }
  function idLimpo(v) { v = String(v || "").replace(/[^A-Za-z0-9_-]/g, "").slice(0, 60); return v || novoId("a"); }
  function receberArquivo(texto) {
    var d; try { d = JSON.parse(texto); } catch (e) { toast("Este arquivo não é uma cópia do NEXO."); return; }
    if (!d || !Array.isArray(d.clientes)) { toast("Este arquivo não é uma cópia do NEXO."); return; }
    var novos = [];
    if (d.nexo === "controle-de-acompanhamento") {
      d.clientes.forEach(function (c) { if (c && typeof c === "object" && c.nome) { c = copia(c); c.id = idLimpo(c.id); novos.push(normal(c)); } });
      if (!novos.length) { toast("A cópia está vazia."); return; }
    } else if (d.nexo === "controle-de-clientes") {
      var ja = {}; S.clientes.forEach(function (c) { ja[String(c.nome).trim().toLowerCase()] = 1; });
      d.clientes.forEach(function (o) {
        if (!o || o.etapa !== "fechado" || o.exemplo || !o.nome || ja[String(o.nome).trim().toLowerCase()]) return;
        var site = o.valorSite != null ? Number(o.valorSite) : null, hosp = o.hospedagem != null ? Number(o.hospedagem) : null;
        var pg = PAGAMENTOS.indexOf(o.pagamento) >= 0 ? o.pagamento : PAGAMENTOS[0], r = sugestao(o.servico, pg, site, hosp);
        var ini = dt(o.fechadoEm) ? o.fechadoEm : hoje();
        novos.push(normal({ id: novoId("a"), nome: String(o.nome), perfil: o.perfil || "", whatsapp: o.whatsapp || "", modelo: o.servico || MODELOS[0], pagamento: pg,
          valorServico: r ? r.site : site, hospedagem: r ? r.hosp : hosp, inicio: ini, meses: DURACAO, faturas: r ? r.faturas : DURACAO, valorFatura: r ? r.valor : null,
          primeiroVenc: ini, pagas: {}, assist: [], obs: o.obs || "", criadoEm: hoje() }));
      });
      if (!novos.length) { toast("Nenhum cliente fechado novo nesta cópia."); return; }
    } else { toast("Este arquivo não é uma cópia do NEXO."); return; }
    var ids = {}; novos.forEach(function (c) { ids[c.id] = 1; });
    S.clientes = S.clientes.filter(function (c) { return !ids[c.id]; }).concat(novos); pintar();
    Promise.all(novos.map(function (c) { return store.set(c); })).then(function () {
      toast(d.nexo === "controle-de-clientes" ? plural(novos.length, "cliente fechado trazido", "clientes fechados trazidos") + ". Confira as faturas de cada um."
        : plural(novos.length, "contrato restaurado", "contratos restaurados") + ".");
    }, falha);
  }

  /* ---------- onde os dados ficam ---------- */
  /* publicado no Claude: banco da conta. Aberto como arquivo ou em outro endereço: este navegador. */

  function exemplos() {

    function pagasAte(ini, n) { var o = {}, i; for (i = 1; i <= n; i++) o[i] = addMeses(ini, i - 1); return o; }
    var a = mais(h0, -4, 0), b = mais(h0, -7, -5), c = mais(h0, -11, 20);

        valorServico: 850, hospedagem: 150, inicio: a, meses: 12, faturas: 12, valorFatura: 220.83, primeiroVenc: a, pagas: pagasAte(a, 4), obs: obs,

        valorServico: 1300, hospedagem: 225, inicio: b, meses: 12, faturas: 12, valorFatura: 333.33, primeiroVenc: b, pagas: pagasAte(b, 6), obs: obs,
        assist: [{ id: "p1", data: mais(b, 1, 5), tipo: TIPOS[0], desc: "Incluir a página de depoimentos" },

      { id: "exemplo-complexo", exemplo: true, nome: "Exemplo: site complexo com animação", perfil: "@perfil_da_marca", whatsapp: "(00) 00000-0000", modelo: "Site complexo com animação", pagamento: "À vista",
        valorServico: 2200, hospedagem: 300, inicio: c, meses: 12, faturas: 1, valorFatura: 4930, primeiroVenc: c, pagas: pagasAte(c, 1), obs: obs,
        assist: [{ id: "p1", data: mais(c, 1, 26), tipo: TIPOS[0], desc: "Ajuste na animação de abertura" },
          { id: "p2", data: mais(c, 6, 14), tipo: TIPOS[0], desc: "Nova seção de lançamentos" },

    ];
  }
  function ligarNavegador() {
    var CHAVE = "nexo.acompanhamento.v1", mem = null;
    function ler() {
      if (mem) return mem;
      var bruto = null; try { bruto = localStorage.getItem(CHAVE); } catch (e) {}
      if (bruto == null) { mem = exemplos().map(normal); return mem; }   // primeira visita neste navegador
      try { var l = JSON.parse(bruto || "[]"); mem = Array.isArray(l) ? l.filter(function (c) { return c && c.id; }).map(normal) : []; } catch (e) { mem = []; }
      return mem;
    }
    function trocar(lista) {
      try { localStorage.setItem(CHAVE, JSON.stringify(lista)); mem = lista; return Promise.resolve(); }
      catch (e) { return Promise.reject({ code: "cheio" }); }
    }
    store = {
      set: function (c) { return trocar(ler().filter(function (x) { return x.id !== c.id; }).concat([copia(c)])); },
      del: function (id) { return trocar(ler().filter(function (x) { return x.id !== id; })); }
    };
    S.clientes = copia(ler()); S.nuvem = false; S.pronto = true; pintar();
    window.addEventListener("storage", function (ev) { if (ev.key === CHAVE) { mem = null; S.clientes = copia(ler()); pintar(); } });
  }
  function ligarNuvem(db, user) {
    var col = db.collection("acompanhamentos"), filas = {}, ultimo = "";
    function fila(id, fn) { var p = (filas[id] || Promise.resolve()).then(fn, fn); filas[id] = p.catch(function () {}); return p; }
    store = {
      set: function (c) { var corpo = copia(c); delete corpo.id; return fila(c.id, function () { return col.doc(c.id).set(corpo); }); },
      del: function (id) { return fila(id, function () { return col.doc(id).delete(); }); }
    };
    S.nuvem = true;
    if (user) user.canEdit().then(function (pode) { if (pode === false) { S.leitura = true; if (S.pronto) pintar(); } }, function () {});
    col.onSnapshot(function (snap) {
      var lista = snap.docs.map(function (d) { var c = copia(d.data() || {}); c.id = d.id; return normal(c); });
      var marca = JSON.stringify(lista);
      if (marca === ultimo && S.pronto) return;
      ultimo = marca; S.clientes = lista; S.pronto = true; S.erro = "";
      pintar();
    }, function () {
      S.erro = "A ligação com os seus dados caiu. Recarregue a página para continuar."; S.leitura = true; pintar();
    });
  }
  /* fora do Claude, com o código de acesso: banco na nuvem, um registro por contrato.
     Cada alteração grava só o contrato mexido; a lista é conferida de novo a cada 20 segundos e ao voltar para a aba. */
  function ligarLink(N) {
    var APP = "acompanhamento", CACHE = "nexo.acompanhamento.nuvem", ANTIGA = "nexo.acompanhamento.v1", LIGADO = "nexo.acompanhamento.nuvem.ok";
    var filas = {}, emCurso = 0, puxando = false, ultimo = "";
    function corpo(c) { var o = copia(c); delete o.id; return o; }
    function guardar() { try { localStorage.setItem(CACHE, JSON.stringify(S.clientes)); } catch (e) {} }
    function jaLigado() { try { return localStorage.getItem(LIGADO) === "1"; } catch (e) { return false; } }
    function fila(id, fn) {
      emCurso++;
      var p = (filas[id] || Promise.resolve()).then(fn, fn);
      filas[id] = p.catch(function () {});
      return p.then(function (v) { emCurso--; guardar(); return v; }, function (e) { emCurso--; puxar(); throw e; });
    }
    store = {
      set: function (c) { var o = corpo(c), id = c.id; return fila(id, function () { return N.gravar(APP, id, o); }); },
      del: function (id) { return fila(id, function () { return N.excluir(APP, id); }); }
    };
    function aplicar(remotos) {
      var marca = JSON.stringify(remotos), mudouRede = S.semRede;
      S.semRede = false; S.erro = ""; S.codigoRuim = false; S.leitura = false;
      if (marca === ultimo && S.pronto && !mudouRede) return;
      ultimo = marca; S.clientes = remotos; S.pronto = true; guardar(); pintar();
    }
    /* primeira vez deste aparelho: o que estava só neste navegador sobe para a nuvem */
    function primeiraVez(remotos, excluidos) {
      var locais = [], tem = {};
      try { locais = JSON.parse(localStorage.getItem(ANTIGA) || "[]"); } catch (e) {}
      remotos.forEach(function (c) { tem[c.id] = 1; }); excluidos.forEach(function (id) { tem[id] = 1; });
      var subir = (Array.isArray(locais) ? locais : []).filter(function (c) { return c && c.id && c.nome && !c.exemplo; })
        .map(function (c) { c = normal(copia(c)); c.id = idLimpo(c.id); return c; }).filter(function (c) { return !tem[c.id]; });
      S.clientes = remotos.concat(subir); S.pronto = true; S.semRede = false; pintar();
      Promise.all(subir.map(function (c) { return N.gravar(APP, c.id, corpo(c)); })).then(function () {
        try { localStorage.setItem(LIGADO, "1"); } catch (e) {}
        guardar();
        if (subir.length) toast(plural(subir.length, "contrato deste aparelho foi enviado", "contratos deste aparelho foram enviados") + " para a nuvem.");
      }, function () { toast("Não foi possível enviar os contratos deste aparelho agora. Eles sobem na próxima abertura."); });
    }
    function puxar() {
      if (puxando || emCurso) return;
      puxando = true;
      N.listar(APP).then(function (lista) {
        puxando = false;
        if (emCurso) return;            // uma gravação começou no meio: a próxima rodada traz tudo
        var remotos = lista.map(function (r) { var c = copia(r.dados || {}); c.id = r.id; return normal(c); });
        if (!jaLigado()) primeiraVez(remotos, lista.excluidos || []); else aplicar(remotos);
      }, function (e) {
        puxando = false;
        if (e && e.code === "codigo") { S.erro = "O código de acesso deste aparelho não confere mais."; S.codigoRuim = true; S.leitura = true; S.pronto = true; pintar(); return; }
        if (!S.pronto) { S.erro = "Sem conexão com a nuvem. Verifique a internet e recarregue a página."; pintar(); return; }
        if (!S.semRede) { S.semRede = true; pintar(); }
      });
    }
    S.nuvem = true; S.link = true;
    try { var guardado = JSON.parse(localStorage.getItem(CACHE) || "null"); if (Array.isArray(guardado) && jaLigado()) { S.clientes = guardado.map(normal); S.pronto = true; pintar(); } } catch (e) {}
    puxar();
    setInterval(function () { if (!document.hidden) puxar(); }, 20000);
    document.addEventListener("visibilitychange", function () { if (!document.hidden) puxar(); });
    window.addEventListener("focus", puxar);
    window.addEventListener("online", puxar);
  }
  function iniciar() {
    var cl = window.claude;
    if (!(cl && typeof cl.use === "function")) {
      if (window.NexoNuvem && window.NexoNuvem.ativo()) ligarLink(window.NexoNuvem); else ligarNavegador();
      return;
    }
    Promise.all([cl.use("db"), cl.use("user")]).then(function (r) {
      if (r[0]) ligarNuvem(r[0], r[1]);
      else { S.erro = "Não foi possível abrir os seus dados agora. Recarregue a página em instantes."; S.leitura = true; pintar(); }
    }, function () { S.erro = "Não foi possível abrir os seus dados agora. Recarregue a página em instantes."; S.leitura = true; pintar(); });
  }

  /* ---------- eventos fixos ---------- */
  (function () {
    var g = $("graf-pts"), i;
    for (i = 0; i < 12; i++) g.appendChild(s("circle", { cx: 8 + i * (404 / 11), cy: 17, r: i === 0 ? 5 : 4, "class": i === 0 ? "" : "oco" }));
  })();
  $("busca").addEventListener("input", function () { S.busca = this.value; S.confirmar = null; pintar(); });
  $("novo").addEventListener("click", function () { form(null); });
  $("baixar").addEventListener("click", baixar);
  $("copiar-link").addEventListener("click", function () { if (window.NexoNuvem) window.NexoNuvem.copiarLink(); });
  $("restaurar").addEventListener("click", function () { modoArquivo = "restaurar"; $("arquivo").click(); });
  $("trazer").addEventListener("click", function () { modoArquivo = "trazer"; toast("Escolha a cópia baixada no Controle de clientes."); $("arquivo").click(); });
  $("arquivo").addEventListener("change", function (ev) {
    var f = ev.target.files && ev.target.files[0]; ev.target.value = "";
    if (!f) return;
    var leitor = new FileReader();
    leitor.onload = function () { receberArquivo(String(leitor.result || "")); };
    leitor.onerror = function () { toast("Não foi possível ler o arquivo."); };
    leitor.readAsText(f);
  });
  var rT = null, larguraAnt = window.innerWidth;
  window.addEventListener("resize", function () {
    if (window.innerWidth === larguraAnt) return; larguraAnt = window.innerWidth;
    clearTimeout(rT); rT = setTimeout(function () { var c = achar(S.sel), el = $("chart"); if (c && el) grafico(el, c, calc(c, hoje())); }, 150);
  });
  window.__nexo = { calc: calc, sugestao: sugestao, addMeses: addMeses, mesesEntre: mesesEntre };
  pintar();
  iniciar();
})();
